<script>
let ws = null;
let me = null;
let isAdminUser = false;
let currentChat = "general";
let friends = [];

const ADMIN_NAMES = [
  "saftpresse040",
  "thcliquide"
];

function getSocketUrl() {
  const protocol =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";

  return (
    protocol +
    "//" +
    location.host
  );
}

function connect() {
  ws = new WebSocket(
    getSocketUrl()
  );

  ws.onopen = () => {
    console.log(
      "FORTX verbunden"
    );
  };

  ws.onmessage = event => {
    try {
      const data =
        JSON.parse(event.data);

      handleServer(data);
    } catch (error) {
      console.error(
        "Ungültige Serverantwort:",
        error
      );
    }
  };

  ws.onclose = () => {
    setTimeout(
      connect,
      2000
    );
  };

  ws.onerror = error => {
    console.error(
      "WebSocket Fehler:",
      error
    );
  };
}

function send(data) {
  if (
    ws &&
    ws.readyState === WebSocket.OPEN
  ) {
    ws.send(
      JSON.stringify(data)
    );

    return true;
  }

  showAuthMessage(
    "Keine Verbindung zum Server."
  );

  return false;
}

function handleServer(data) {

  if (data.type === "error") {
    showAuthMessage(
      data.text
    );
    return;
  }

  if (
    data.type === "registered" ||
    data.type === "loggedIn"
  ) {
    enterApp(
      data.username,
      data.isAdmin
    );
    return;
  }

  if (
    data.type ===
    "forgotPasswordSent"
  ) {
    alert(data.text);
    closeForgot();
    return;
  }

  if (
    data.type ===
    "passwordResetRequest"
  ) {
    if (isAdminUser) {
      alert(
        "Passwort-Reset angefragt für: " +
        data.username
      );
    }
    return;
  }

  if (
    data.type ===
    "passwordResetLink"
  ) {
    prompt(
      "Reset-Link für " +
      data.username +
      ":",
      data.resetUrl
    );
    return;
  }

  if (
    data.type ===
    "passwordResetSuccess"
  ) {
    alert(
      "Passwort erfolgreich geändert."
    );
    return;
  }

  if (data.type === "friends") {
    friends =
      data.friends || [];

    renderContacts();
    return;
  }

  if (data.type === "friendAdded") {
    send({
      type: "getFriends"
    });
    return;
  }

  if (data.type === "newUser") {
    if (isAdminUser) {
      send({
        type: "getFriends"
      });

      if (
        document
          .getElementById("usersModal")
          .classList.contains("hidden") === false
      ) {
        send({
          type: "getUsers"
        });
      }
    }

    return;
  }

  if (
    data.type ===
    "groupMessages"
  ) {
    if (
      currentChat ===
      "general"
    ) {
      renderMessages(
        data.messages || [],
        true
      );
    }

    return;
  }

  if (
    data.type ===
    "privateMessages"
  ) {
    if (
      currentChat ===
      data.username
    ) {
      renderMessages(
        data.messages || [],
        false
      );
    }

    return;
  }

  if (
    data.type ===
    "groupMessage"
  ) {
    if (
      currentChat ===
      "general"
    ) {
      appendMessage(
        data.message,
        true
      );
    }

    return;
  }

  if (data.type === "message") {

    if (
      currentChat === data.from ||
      currentChat === data.to
    ) {
      appendMessage(
        {
          from: data.from,
          to: data.to,
          text: data.text,
          imageUrl:
            data.imageUrl,
          time: data.time
        },
        false
      );
    }

    /*
     * Falls jemand eine Nachricht erhält,
     * dessen Chat gerade nicht offen ist,
     * aktualisieren wir zumindest die Kontakte.
     */
    if (
      data.to === me &&
      currentChat !== data.from
    ) {
      renderContacts();
    }

    return;
  }

  if (data.type === "users") {
    renderUsers(
      data.users || []
    );
  }
}

function enterApp(
  username,
  admin
) {
  me = username;
  isAdminUser = !!admin;

  document
    .getElementById("auth")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");

  document
    .getElementById("myName")
    .textContent =
    username;

  document
    .getElementById("myRole")
    .textContent =
    isAdminUser
      ? "👑 Admin"
      : "Mitglied";

  document
    .getElementById(
      "adminUsersBtn"
    )
    .classList.toggle(
      "hidden",
      !isAdminUser
    );

  send({
    type: "getFriends"
  });

  openGeneral();
}

function showAuth(type) {

  const login =
    type === "login";

  document
    .getElementById("loginForm")
    .classList.toggle(
      "hidden",
      !login
    );

  document
    .getElementById("registerForm")
    .classList.toggle(
      "hidden",
      login
    );

  document
    .getElementById("loginTab")
    .classList.toggle(
      "active",
      login
    );

  document
    .getElementById("registerTab")
    .classList.toggle(
      "active",
      !login
    );

  document
    .getElementById(
      "authMessage"
    )
    .classList.add(
      "hidden"
    );
}

function login() {
  send({
    type: "login",
    username:
      document.getElementById(
        "loginUsername"
      ).value,
    password:
      document.getElementById(
        "loginPassword"
      ).value
  });
}

function register() {
  send({
    type: "register",
    username:
      document.getElementById(
        "registerUsername"
      ).value,
    password:
      document.getElementById(
        "registerPassword"
      ).value,
    accessCode:
      document.getElementById(
        "registerAccess"
      ).value
  });
}

function showForgot() {
  document
    .getElementById(
      "forgotModal"
    )
    .classList.remove(
      "hidden"
    );
}

function closeForgot() {
  document
    .getElementById(
      "forgotModal"
    )
    .classList.add(
      "hidden"
    );
}

function forgotPassword() {
  send({
    type:
      "forgotPassword",
    username:
      document.getElementById(
        "forgotUsername"
      ).value
  });
}

function showAuthMessage(text) {
  const box =
    document.getElementById(
      "authMessage"
    );

  box.textContent = text;
  box.classList.remove(
    "hidden"
  );
}

function renderContacts() {

  const container =
    document.getElementById(
      "contacts"
    );

  container.innerHTML = "";

  addContact(
    "general",
    "Allgemein",
    "👥",
    true
  );

  for (
    const username of friends
  ) {
    if (
      username === me
    ) {
      continue;
    }

    addContact(
      username,
      username,
      ADMIN_NAMES.includes(
        username
      )
        ? "👑"
        : username
            .charAt(0)
            .toUpperCase(),
      false
    );
  }
}

function addContact(
  id,
  name,
  avatar,
  general
) {
  const el =
    document.createElement(
      "div"
    );

  el.className =
    "contact";

  if (
    currentChat === id
  ) {
    el.classList.add(
      "active"
    );
  }

  const admin =
    ADMIN_NAMES.includes(
      name
    );

  el.innerHTML = `
    <div class="avatar">
      ${escapeHtml(avatar)}
    </div>

    <div class="contact-info">

      <div class="contact-name">
        ${escapeHtml(name)}
        ${
          admin
            ? '<span class="admin-badge">👑</span>'
            : ""
        }
      </div>

      <div class="contact-role">
        ${
          general
            ? "Gruppenchat"
            : admin
              ? "Admin"
              : "Kontakt"
        }
      </div>

    </div>
  `;

  el.onclick = () => {
    if (general) {
      openGeneral();
    } else {
      openPrivate(name);
    }
  };

  document
    .getElementById(
      "contacts"
    )
    .appendChild(el);
}

function openGeneral() {

  currentChat =
    "general";

  document
    .getElementById(
      "chatTitle"
    )
    .textContent =
    "Allgemein";

  document
    .getElementById(
      "chatStatus"
    )
    .textContent =
    isAdminUser
      ? "Du kannst schreiben"
      : "Nur Lesen";

  document
    .getElementById(
      "chatAvatar"
    )
    .textContent =
    "👥";

  document
    .getElementById(
      "messages"
    ).innerHTML = "";

  renderContacts();

  send({
    type:
      "getGroupMessages"
  });
}

function openPrivate(username) {

  currentChat =
    username;

  document
    .getElementById(
      "chatTitle"
    )
    .textContent =
    username;

  document
    .getElementById(
      "chatStatus"
    )
    .textContent =
    ADMIN_NAMES.includes(
      username
    )
      ? "👑 Admin"
      : "Kontakt";

  document
    .getElementById(
      "chatAvatar"
    )
    .textContent =
    ADMIN_NAMES.includes(
      username
    )
      ? "👑"
      : username
          .charAt(0)
          .toUpperCase();

  document
    .getElementById(
      "messages"
    ).innerHTML = "";

  renderContacts();

  send({
    type:
      "getPrivateMessages",
    username
  });
}

function renderMessages(
  messages,
  group
) {
  const container =
    document.getElementById(
      "messages"
    );

  container.innerHTML = "";

  if (!messages.length) {
    container.innerHTML =
      '<div class="empty">Noch keine Nachrichten</div>';

    return;
  }

  messages.forEach(
    message => {
      appendMessage(
        message,
        group,
        false
      );
    }
  );

  scrollBottom();
}

function appendMessage(
  message,
  group,
  scroll = true
) {
  const container =
    document.getElementById(
      "messages"
    );

  const empty =
    container.querySelector(
      ".empty"
    );

  if (empty) {
    empty.remove();
  }

  const sender =
    group
      ? message.username
      : message.from;

  const mine =
    sender === me;

  const row =
    document.createElement(
      "div"
    );

  row.className =
    "msg-row" +
    (
      mine
        ? " me"
        : ""
    );

  const box =
    document.createElement(
      "div"
    );

  box.className =
    "msg";

  if (
    group &&
    !mine
  ) {
    const name =
      document.createElement(
        "div"
      );

    name.className =
      "msg-user";

    name.textContent =
      sender +
      (
        ADMIN_NAMES.includes(
          sender
        )
          ? " 👑"
          : ""
      );

    box.appendChild(
      name
    );
  }

  if (message.imageUrl) {

    const img =
      document.createElement(
        "img"
      );

    img.className =
      "msg-image";

    img.src =
      message.imageUrl;

    img.loading =
      "lazy";

    img.alt =
      "Bild";

    img.onclick = () => {
      window.open(
        message.imageUrl,
        "_blank"
      );
    };

    box.appendChild(
      img
    );
  }

  if (message.text) {

    const text =
      document.createElement(
        "div"
      );

    text.textContent =
      message.text;

    box.appendChild(
      text
    );
  }

  const time =
    document.createElement(
      "div"
    );

  time.className =
    "msg-time";

  time.textContent =
    formatTime(
      message.time
    );

  box.appendChild(
    time
  );

  row.appendChild(
    box
  );

  container.appendChild(
    row
  );

  if (scroll) {
    scrollBottom();
  }
}

function sendMessage() {

  const input =
    document.getElementById(
      "messageInput"
    );

  const text =
    input.value.trim();

  if (!text) return;

  if (
    currentChat ===
    "general"
  ) {

    if (!isAdminUser) {
      alert(
        "Nur die Admins können im Allgemein-Chat schreiben."
      );

      return;
    }

    send({
      type:
        "groupMessage",
      text
    });

  } else {

    send({
      type:
        "message",
      to:
        currentChat,
      text
    });
  }

  input.value = "";
}

function sendImage() {

  const input =
    document.getElementById(
      "imageInput"
    );

  const file =
    input.files[0];

  if (!file) return;

  if (
    file.size >
    8 * 1024 * 1024
  ) {
    alert(
      "Das Bild darf maximal 8 MB groß sein."
    );

    input.value = "";
    return;
  }

  if (
    currentChat ===
      "general" &&
    !isAdminUser
  ) {
    alert(
      "Nur die Admins können im Allgemein-Chat Bilder senden."
    );

    input.value = "";
    return;
  }

  const reader =
    new FileReader();

  reader.onload = () => {

    send({
      type:
        "uploadImage",

      image:
        reader.result,

      target:
        currentChat === "general"
          ? "general"
          : "private",

      to:
        currentChat === "general"
          ? null
          : currentChat
    });
  };

  reader.onerror = () => {
    alert(
      "Bild konnte nicht gelesen werden."
    );
  };

  reader.readAsDataURL(
    file
  );

  input.value = "";
}

function handleEnter(event) {

  if (
    event.key === "Enter" &&
    !event.shiftKey
  ) {
    event.preventDefault();

    sendMessage();
  }
}

function scrollBottom() {

  const box =
    document.getElementById(
      "messages"
    );

  box.scrollTop =
    box.scrollHeight;
}

function formatTime(time) {

  if (!time) return "";

  return new Date(
    Number(time)
  ).toLocaleTimeString(
    "de-DE",
    {
      hour: "2-digit",
      minute: "2-digit"
    }
  );
}

function openSettings() {

  const saved =
    localStorage.getItem(
      "fortx-theme"
    ) || "dark";

  document
    .getElementById(
      "themeSelect"
    ).value =
    saved;

  document
    .getElementById(
      "settingsModal"
    )
    .classList.remove(
      "hidden"
    );
}

function closeSettings() {

  document
    .getElementById(
      "settingsModal"
    )
    .classList.add(
      "hidden"
    );
}

function changeTheme() {

  const theme =
    document.getElementById(
      "themeSelect"
    ).value;

  document.body.classList.toggle(
    "light",
    theme === "light"
  );

  localStorage.setItem(
    "fortx-theme",
    theme
  );
}

function showUsers() {

  if (!isAdminUser) return;

  document
    .getElementById(
      "usersModal"
    )
    .classList.remove(
      "hidden"
    );

  send({
    type:
      "getUsers"
  });
}

function closeUsers() {

  document
    .getElementById(
      "usersModal"
    )
    .classList.add(
      "hidden"
    );
}

function renderUsers(users) {

  const list =
    document.getElementById(
      "usersList"
    );

  list.innerHTML = "";

  if (!users.length) {
    list.innerHTML =
      '<div class="empty">Keine Benutzer vorhanden.</div>';

    return;
  }

  users.forEach(
    user => {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "user-row";

      const info =
        document.createElement(
          "div"
        );

      const name =
        document.createElement(
          "div"
        );

      name.className =
        "user-name";

      name.textContent =
        user.username +
        (
          ADMIN_NAMES.includes(
            user.username
          )
            ? " 👑"
            : ""
        );

      info.appendChild(
        name
      );

      if (
        user.createdAt
      ) {
        const created =
          document.createElement(
            "div"
          );

        created.className =
          "user-created";

        created.textContent =
          "Registriert: " +
          new Date(
            user.createdAt
          ).toLocaleDateString(
            "de-DE"
          );

        info.appendChild(
          created
        );
      }

      row.appendChild(
        info
      );

      /*
       * Eigene Admin-Konten werden nicht
       * über den Reset-Button bearbeitet.
       */
      if (
        !ADMIN_NAMES.includes(
          user.username
        )
      ) {
        const reset =
          document.createElement(
            "button"
          );

        reset.className =
          "reset-btn";

        reset.textContent =
          "Reset";

        reset.onclick = () => {

          send({
            type:
              "createPasswordReset",

            username:
              user.username
          });

        };

        row.appendChild(
          reset
        );
      }

      list.appendChild(
        row
      );
    }
  );
}

function logout() {
  location.reload();
}

function escapeHtml(value) {
  return String(value)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}

/* THEME */

  localStorage.getItem(

  ) || "dark";

document.body.classList.toggle(

);

connect();

  ).get("reset");

if (resetToken) {

      );

    if (password) {
      send({
        type:

        token:

        password
      });
    }

}
</script>

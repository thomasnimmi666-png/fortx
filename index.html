<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Privater Messenger</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
    }

    .screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 380px;
      background: #111;
      border: 1px solid #292929;
      border-radius: 20px;
      padding: 25px;
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    h2 {
      text-align: center;
    }

    p {
      color: #999;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      background: #181818;
      color: white;
      border: 1px solid #333;
      border-radius: 12px;
      outline: none;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 12px;
      background: white;
      color: black;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .secondary {
      background: #222;
      color: white;
      border: 1px solid #333;
    }

    .error {
      color: #ff5c5c;
      text-align: center;
      min-height: 20px;
      margin-top: 10px;
    }

    .success {
      color: #6cff8a;
      text-align: center;
      margin-top: 10px;
    }

    #loginScreen,
    #registerScreen,
    #app {
      display: none;
    }

    header {
      padding: 18px;
      text-align: center;
      font-size: 21px;
      font-weight: bold;
      border-bottom: 1px solid #222;
    }

    #status {
      text-align: center;
      padding: 8px;
      color: #999;
      font-size: 13px;
    }

    .page {
      padding: 16px;
    }

    .profile {
      text-align: center;
      padding: 20px 10px;
      border-bottom: 1px solid #222;
    }

    #profileImage {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      background: #222;
      display: block;
      margin: auto auto 12px;
    }

    #myUsername {
      font-weight: bold;
      font-size: 18px;
    }

    .profileButton {
      width: auto;
      padding: 10px 16px;
      margin-top: 10px;
    }

    .sectionTitle {
      margin-top: 20px;
      margin-bottom: 10px;
      font-size: 14px;
      color: #888;
      font-weight: bold;
    }

    .friendRequest {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 8px;
    }

    .requestButtons {
      display: flex;
      gap: 8px;
    }

    .requestButtons button {
      flex: 1;
    }

    #search {
      margin: 18px 0;
    }

    .friend {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px;
      margin-bottom: 8px;
      background: #111;
      border: 1px solid #222;
      border-radius: 15px;
      cursor: pointer;
    }

    .avatar,
    .groupIcon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .friendName {
      font-weight: bold;
    }

    .lastMessage {
      color: #888;
      font-size: 14px;
      margin-top: 4px;
    }

    .groupChatCard {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      margin-bottom: 12px;
      background: #111;
      border: 1px solid #292929;
      border-radius: 16px;
      cursor: pointer;
    }

    .animatedName {
      font-weight: bold;
      animation: nameGlow 2s ease-in-out infinite;
    }

    @keyframes nameGlow {
      0%, 100% {
        text-shadow: 0 0 3px #fff;
      }

      50% {
        text-shadow: 0 0 12px #fff;
      }
    }

    .adminName {
      font-weight: bold;
      animation: adminGlow 2s ease-in-out infinite;
    }

    @keyframes adminGlow {
      0%, 100% {
        text-shadow: 0 0 4px #fff;
      }

      50% {
        text-shadow: 0 0 16px #fff;
      }
    }

    #chatPage {
      display: none;
      height: calc(100vh - 90px);
      flex-direction: column;
    }

    #chatHeader {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-bottom: 1px solid #222;
    }

    #backButton {
      width: auto;
      margin: 0;
      padding: 5px 10px;
      background: none;
      color: white;
      font-size: 25px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      width: fit-content;
      max-width: 80%;
      padding: 10px 14px;
      margin: 8px 0;
      background: #181818;
      border: 1px solid #292929;
      border-radius: 15px;
    }

    .mine {
      margin-left: auto;
      background: #252525;
    }

    .messageUser {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 4px;
      font-weight: bold;
    }

    #inputArea {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid #222;
    }

    #messageInput {
      margin: 0;
      flex: 1;
    }

    #sendButton {
      width: auto;
      margin: 0;
    }

    #groupReadOnly {
      display: none;
      text-align: center;
      color: #888;
      font-size: 13px;
      padding: 10px;
      border-top: 1px solid #222;
    }

    #friendRequests {
      margin-bottom: 15px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

<div id="accessScreen" class="screen">
  <div class="box">
    <h1>🔐</h1>

    <h2>Privater Messenger</h2>

    <p>
      Gib den Zugangscode ein.
    </p>

    <input
      id="accessCode"
      type="password"
      placeholder="Zugangscode"
    >

    <button onclick="checkAccess()">
      Weiter
    </button>

    <div id="accessError" class="error"></div>
  </div>
</div>


<div id="loginScreen" class="screen">
  <div class="box">

    <h1>👤</h1>

    <h2>Anmelden</h2>

    <input
      id="loginUsername"
      type="text"
      placeholder="Benutzername"
      autocomplete="username"
    >

    <input
      id="loginPassword"
      type="password"
      placeholder="Passwort"
      autocomplete="current-password"
    >

    <button onclick="login()">
      Anmelden
    </button>

    <button
      class="secondary"
      onclick="showRegister()"
    >
      Neues Konto erstellen
    </button>

    <button
      class="secondary"
      onclick="forgotPassword()"
    >
      Passwort vergessen
    </button>

    <div id="loginError" class="error"></div>

    <div id="loginSuccess" class="success"></div>

  </div>
</div>


<div id="registerScreen" class="screen">
  <div class="box">

    <h1>✨</h1>

    <h2>Konto erstellen</h2>

    <input
      id="registerUsername"
      type="text"
      placeholder="Benutzername"
      autocomplete="username"
    >

    <input
      id="registerPassword"
      type="password"
      placeholder="Passwort (mind. 8 Zeichen)"
      autocomplete="new-password"
    >

    <button onclick="register()">
      Konto erstellen
    </button>

    <button
      class="secondary"
      onclick="showLogin()"
    >
      Zur Anmeldung
    </button>

    <div id="registerError" class="error"></div>

  </div>
</div>


<div id="resetScreen" class="screen" style="display:none;">
  <div class="box">

    <h1>🔑</h1>

    <h2>Passwort zurücksetzen</h2>

    <input
      id="resetPasswordInput"
      type="password"
      placeholder="Neues Passwort (mind. 8 Zeichen)"
    >

    <button onclick="resetPassword()">
      Passwort ändern
    </button>

    <div id="resetError" class="error"></div>

  </div>
</div>


<div id="app">

  <header>
    🔐 Privater Messenger
  </header>

  <div id="status">
    🔄 Verbindung wird hergestellt...
  </div>

  <div id="homePage" class="page">

    <div class="profile">

      <img
        id="profileImage"
        alt="Profilbild"
      >

      <div id="myUsername">
        Benutzer
      </div>

      <input
        id="profileFile"
        type="file"
        accept="image/*"
        style="display:none"
        onchange="changeProfileImage(event)"
      >

      <button
        class="profileButton"
        onclick="document.getElementById('profileFile').click()"
      >
        🖼️ Profilbild ändern
      </button>

    </div>


    <div class="sectionTitle">
      FREUND HINZUFÜGEN
    </div>

    <input
      id="friendUsername"
      type="text"
      placeholder="Benutzername"
    >

    <button onclick="addFriend()">
      + Freund hinzufügen
    </button>


    <div id="friendRequestsSection" class="hidden">

      <div class="sectionTitle">
        FREUNDSCHAFTSANFRAGEN
      </div>

      <div id="friendRequests"></div>

    </div>


    <input
      id="search"
      type="text"
      placeholder="🔎 Freunde suchen..."
      oninput="searchFriends()"
    >


    <div
      class="groupChatCard"
      onclick="openGroupChat()"
    >

      <div class="groupIcon">
        🌐
      </div>

      <div>
        <div class="animatedName">
          Allgemein
        </div>

        <div class="lastMessage">
          Großer Gruppenchat
        </div>
      </div>

    </div>


    <div id="friends"></div>

  </div>


  <div id="chatPage">

    <div id="chatHeader">

      <button
        id="backButton"
        onclick="closeChat()"
      >
        ←
      </button>

      <strong id="chatTitle">
        Chat
      </strong>

    </div>


    <div id="messages"></div>


    <div id="groupReadOnly">
      👀 Du kannst hier nur lesen.
    </div>


    <div id="inputArea">

      <input
        id="messageInput"
        type="text"
        placeholder="Nachricht schreiben..."
      >

      <button
        id="sendButton"
        onclick="sendMessage()"
      >
        Senden
      </button>

    </div>

  </div>

</div>


<script>

let socket = null;
let currentFriend = null;
let currentChatType = "private";
let friends = [];
let resetToken = null;


const GROUP_ADMINS = [
  "saftpresse040",
  "thcliquide"
];


function normalizeUsername(username) {
  return String(username || "")
    .trim()
    .toLowerCase();
}


function isGroupAdmin() {

  const username =
    localStorage.getItem("username");

  return GROUP_ADMINS.includes(
    normalizeUsername(username)
  );
}


function getDisplayName(username) {

  if (!username) {
    return "";
  }

  const name =
    normalizeUsername(username);

  if (name === "saftpresse040") {
    return "Saftpresse040 🧃 👑";
  }

  if (name === "thcliquide") {
    return "Thcliquide 🧃 👑";
  }

  return username;
}


function connectSocket() {

  socket = new WebSocket(
    "wss://fortx.onrender.com"
  );


  socket.onopen = () => {

    document.getElementById(
      "status"
    ).textContent =
      "🟢 Server verbunden";

    const savedUsername =
      localStorage.getItem(
        "username"
      );

    if (savedUsername) {
      loadFriends();
      loadFriendRequests();
    }

  };


  socket.onmessage = (event) => {

    try {

      const data =
        JSON.parse(event.data);


      if (data.type === "error") {

        showError(
          data.text
        );

        return;
      }


      if (
        data.type ===
        "registered"
      ) {

        localStorage.setItem(
          "username",
          data.username
        );

        showApp();

        return;
      }


      if (
        data.type ===
        "loggedIn"
      ) {

        localStorage.setItem(
          "username",
          data.username
        );

        if (data.profileImage) {

          localStorage.setItem(
            "profileImage",
            data.profileImage
          );

          document.getElementById(
            "profileImage"
          ).src =
            data.profileImage;
        }

        showApp();

        return;
      }


      if (
        data.type ===
        "friends"
      ) {

        friends =
          data.friends || [];

        renderFriends();

        return;
      }


      if (
        data.type ===
        "friendRequests"
      ) {

        renderFriendRequests(
          data.requests || []
        );

        return;
      }


      if (
        data.type ===
        "friendRequest"
      ) {

        alert(
          "Neue Freundschaftsanfrage von @" +
          data.from
        );

        loadFriendRequests();

        return;
      }


      if (
        data.type ===
        "requestSent"
      ) {

        alert(
          "Freundschaftsanfrage an @" +
          data.to +
          " gesendet."
        );

        return;
      }


      if (
        data.type ===
        "friendAccepted"
      ) {

        alert(
          "Ihr seid jetzt befreundet mit @" +
          data.username
        );

        loadFriends();
        loadFriendRequests();

        return;
      }


      if (
        data.type ===
        "profileImageSaved"
      ) {

        localStorage.setItem(
          "profileImage",
          data.image
        );

        return;
      }


      if (
        data.type ===
        "message"
      ) {

        if (
          currentChatType ===
            "private" &&
          normalizeUsername(
            data.from
          ) ===
            normalizeUsername(
              currentFriend
            )
        ) {

          addPrivateMessage(
            data.text,
            false
          );

        }

        return;
      }


      if (
        data.type ===
        "groupMessages"
      ) {

        document.getElementById(
          "messages"
        ).innerHTML = "";

        data.messages.forEach(
          message => {

            addGroupMessage(
              message.username,
              message.text
            );

          }
        );

        return;
      }


      if (
        data.type ===
        "groupMessage"
      ) {

        if (
          currentChatType ===
          "group"
        ) {

          addGroupMessage(
            data.message.username,
            data.message.text
          );

        }

        return;
      }


      if (
        data.type ===
        "forgotPasswordSent"
      ) {

        document.getElementById(
          "loginSuccess"
        ).textContent =
          data.text;

        return;
      }


      if (
        data.type ===
        "passwordResetLink"
      ) {

        alert(
          "Reset-Link für @" +
          data.username +
          ":\n\n" +
          data.resetUrl +
          "\n\nDer Link ist 15 Minuten gültig."
        );

        return;
      }


      if (
        data.type ===
        "passwordResetSuccess"
      ) {

        alert(
          "Passwort erfolgreich geändert."
        );

        showLogin();

        return;
      }

    } catch (error) {

      console.log(
        "Fehler:",
        error
      );

    }

  };


  socket.onerror = () => {

    document.getElementById(
      "status"
    ).textContent =
      "🔴 Server nicht erreichbar";

  };


  socket.onclose = () => {

    document.getElementById(
      "status"
    ).textContent =
      "🔴 Verbindung getrennt";

  };

}


function showError(text) {

  document.getElementById(
    "loginError"
  ).textContent =
    text;

  document.getElementById(
    "registerError"
  ).textContent =
    text;

  document.getElementById(
    "resetError"
  ).textContent =
    text;

}


function checkAccess() {

  const code =
    document.getElementById(
      "accessCode"
    ).value;

  if (!code) {

    document.getElementById(
      "accessError"
    ).textContent =
      "Bitte Zugangscode eingeben.";

    return;

  }

  sessionStorage.setItem(
    "accessCode",
    code
  );

  document.getElementById(
    "accessScreen"
  ).style.display =
    "none";

  document.getElementById(
    "loginScreen"
  ).style.display =
    "flex";

}


function showRegister() {

  document.getElementById(
    "loginScreen"
  ).style.display =
    "none";

  document.getElementById(
    "registerScreen"
  ).style.display =
    "flex";

}


function showLogin() {

  document.getElementById(
    "registerScreen"
  ).style.display =
    "none";

  document.getElementById(
    "resetScreen"
  ).style.display =
    "none";

  document.getElementById(
    "loginScreen"
  ).style.display =
    "flex";

}


function register() {

  const username =
    document.getElementById(
      "registerUsername"
    ).value.trim();

  const password =
    document.getElementById(
      "registerPassword"
    ).value;

  const accessCode =
    sessionStorage.getItem(
      "accessCode"
    );

  if (!username || !password) {

    document.getElementById(
      "registerError"
    ).textContent =
      "Bitte alles ausfüllen.";

    return;
  }

  if (password.length < 8) {

    document.getElementById(
      "registerError"
    ).textContent =
      "Das Passwort muss mindestens 8 Zeichen haben.";

    return;
  }

  if (
    !socket ||
    socket.readyState !==
    WebSocket.OPEN
  ) {

    document.getElementById(
      "registerError"
    ).textContent =
      "Server noch nicht verbunden.";

    return;
  }

  socket.send(
    JSON.stringify({
      type: "register",
      username,
      password,
      accessCode
    })
  );

}


function login() {

  const username =
    document.getElementById(
      "loginUsername"
    ).value.trim();

  const password =
    document.getElementById(
      "loginPassword"
    ).value;

  if (!username || !password) {

    document.getElementById(
      "loginError"
    ).textContent =
      "Bitte Benutzername und Passwort eingeben.";

    return;
  }

  if (
    !socket ||
    socket.readyState !==
    WebSocket.OPEN
  ) {

    document.getElementById(
      "loginError"
    ).textContent =
      "Server noch nicht verbunden.";

    return;
  }

  socket.send(
    JSON.stringify({
      type: "login",
      username,
      password
    })
  );

}


function forgotPassword() {

  const username =
    document.getElementById(
      "loginUsername"
    ).value.trim();

  if (!username) {

    document.getElementById(
      "loginError"
    ).textContent =
      "Gib zuerst deinen Benutzernamen ein.";

    return;
  }

  if (
    !socket ||
    socket.readyState !==
    WebSocket.OPEN
  ) {

    document.getElementById(
      "loginError"
    ).textContent =
      "Server noch nicht verbunden.";

    return;
  }

  socket.send(
    JSON.stringify({
      type: "forgotPassword",
      username
    })
  );

}


function showApp() {

  document.getElementById(
    "loginScreen"
  ).style.display =
    "none";

  document.getElementById(
    "registerScreen"
  ).style.display =
    "none";

  document.getElementById(
    "accessScreen"
  ).style.display =
    "none";

  document.getElementById(
    "resetScreen"
  ).style.display =
    "none";

  document.getElementById(
    "app"
  ).style.display =
    "block";


  const username =
    localStorage.getItem(
      "username"
    );


  const usernameElement =
    document.getElementById(
      "myUsername"
    );


  usernameElement.textContent =
    getDisplayName(username);


  if (isGroupAdmin()) {

    usernameElement.classList.add(
      "adminName"
    );

  } else {

    usernameElement.classList.remove(
      "adminName"
    );

  }


  loadFriends();
  loadFriendRequests();

}


function loadFriends() {

  if (
    socket &&
    socket.readyState ===
    WebSocket.OPEN
  ) {

    socket.send(
      JSON.stringify({
        type: "getFriends"
      })
    );

  }

}


function loadFriendRequests() {

  if (
    socket &&
    socket.readyState ===
    WebSocket.OPEN
  ) {

    socket.send(
      JSON.stringify({
        type: "getFriendRequests"
      })
    );

  }

}


function addFriend() {

  const input =
    document.getElementById(
      "friendUsername"
    );

  const username =
    input.value.trim();

  if (!username) {

    alert(
      "Bitte einen Benutzernamen eingeben."
    );

    return;
  }

  if (
    !socket ||
    socket.readyState !==
    WebSocket.OPEN
  ) {

    alert(
      "Keine Serververbindung."
    );

    return;
  }

  socket.send(
    JSON.stringify({
      type: "addFriend",
      username
    })
  );

  input.value = "";

}


function renderFriends() {

  const container =
    document.getElementById(
      "friends"
    );

  container.innerHTML = "";

  if (!friends.length) {

    const empty =
      document.createElement(
        "div"
      );

    empty.style.color =
      "#777";

    empty.style.textAlign =
      "center";

    empty.style.padding =
      "20px";

    empty.textContent =
      "Noch keine Freunde.";

    container.appendChild(
      empty
    );

    return;
  }


  friends.forEach(
    friend => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "friend";

      card.onclick =
        () =>
          openChat(
            friend.username
          );


      const avatar =
        document.createElement(
          "div"
        );

      avatar.className =
        "avatar";


      if (friend.profile_image) {

        const img =
          document.createElement(
            "img"
          );

        img.src =
          friend.profile_image;

        avatar.appendChild(
          img
        );

      } else {

        avatar.textContent =
          "👤";

      }


      const info =
        document.createElement(
          "div"
        );


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "friendName";

      name.textContent =
        getDisplayName(
          friend.username
        );


      const last =
        document.createElement(
          "div"
        );

      last.className =
        "lastMessage";

      last.textContent =
        "Privater Chat";


      info.appendChild(
        name
      );

      info.appendChild(
        last
      );


      card.appendChild(
        avatar
      );

      card.appendChild(
        info
      );


      container.appendChild(
        card
      );

    }
  );

}


function renderFriendRequests(requests) {

  const section =
    document.getElementById(
      "friendRequestsSection"
    );

  const container =
    document.getElementById(
      "friendRequests"
    );

  container.innerHTML = "";


  if (!requests.length) {

    section.classList.add(
      "hidden"
    );

    return;
  }


  section.classList.remove(
    "hidden"
  );


  requests.forEach(
    request => {

      const box =
        document.createElement(
          "div"
        );

      box.className =
        "friendRequest";


      const text =
        document.createElement(
          "div"
        );

      text.textContent =
        "👤 @" +
        request.requester +
        " möchte dich als Freund hinzufügen.";


      const buttons =
        document.createElement(
          "div"
        );

      buttons.className =
        "requestButtons";


      const accept =
        document.createElement(
          "button"
        );

      accept.textContent =
        "Annehmen";

      accept.onclick =
        () =>
          acceptFriend(
            request.requester
          );


      buttons.appendChild(
        accept
      );


      box.appendChild(
        text
      );

      box.appendChild(
        buttons
      );


      container.appendChild(
        box
      );

    }
  );

}


function acceptFriend(username) {

  if (
    !socket ||
    socket.readyState !==
    WebSocket.OPEN
  ) {
    return;
  }

  socket.send(
    JSON.stringify({
      type: "acceptFriend",
      username
    })
  );

}


function openChat(friend) {

  currentChatType =
    "private";

  currentFriend =
    friend;


  document.getElementById(
    "homePage"
  ).style.display =
    "none";


  document.getElementById(
    "chatPage"
  ).style.display =
    "flex";


  document.getElementById(
    "chatTitle"
  ).textContent =
    getDisplayName(friend);


  document.getElementById(
    "messages"
  ).innerHTML =
    "";


  document.getElementById(
    "inputArea"
  ).style.display =
    "flex";


  document.getElementById(
    "groupReadOnly"
  ).style.display =
    "none";

}


function openGroupChat() {

  currentChatType =
    "group";

  currentFriend =
    null;


  document.getElementById(
    "homePage"
  ).style.display =
    "none";


  document.getElementById(
    "chatPage"
  ).style.display =
    "flex";


  document.getElementById(
    "chatTitle"
  ).textContent =
    "🌐 Allgemein";


  document.getElementById(
    "messages"
  ).innerHTML =
    "";


  if (isGroupAdmin()) {

    document.getElementById(
      "inputArea"
    ).style.display =
      "flex";

    document.getElementById(
      "groupReadOnly"
    ).style.display =
      "none";

  } else {

    document.getElementById(
      "inputArea"
    ).style.display =
      "none";

    document.getElementById(
      "groupReadOnly"
    ).style.display =
      "block";

  }


  if (
    socket &&
    socket.readyState ===
    WebSocket.OPEN
  ) {

    socket.send(
      JSON.stringify({
        type:
          "getGroupMessages"
      })
    );

  }

}


function closeChat() {

  currentFriend =
    null;

  currentChatType =
    "private";


  document.getElementById(
    "chatPage"
  ).style.display =
    "none";


  document.getElementById(
    "homePage"
  ).style.display =
    "block";

}


function sendMessage() {

  const input =
    document.getElementById(
      "messageInput"
    );

  const text =
    input.value.trim();


  if (!text) {
    return;
  }


  if (
    !socket ||
    socket.readyState !==
    WebSocket.OPEN
  ) {

    alert(
      "Keine Serververbindung."
    );

    return;
  }


  if (
    currentChatType ===
    "group"
  ) {

    if (!isGroupAdmin()) {

      alert(
        "Du darfst im Gruppenchat nur lesen."
      );

      return;
    }


    socket.send(
      JSON.stringify({
        type:
          "groupMessage",
        text
      })
    );


    input.value = "";

    return;
  }


  socket.send(
    JSON.stringify({
      type:
        "message",
      to:
        currentFriend,
      text
    })
  );


  addPrivateMessage(
    text,
    true
  );


  input.value = "";

}


function addPrivateMessage(
  text,
  mine
) {

  const message =
    document.createElement(
      "div"
    );

  message.className =
    mine
      ? "message mine"
      : "message";

  message.textContent =
    text;

  document.getElementById(
    "messages"
  ).appendChild(
    message
  );

  scrollMessages();

}


function addGroupMessage(
  username,
  text
) {

  const wrapper =
    document.createElement(
      "div"
    );

  wrapper.className =
    "message";


  const user =
    document.createElement(
      "div"
    );

  user.className =
    "messageUser";


  const normalized =
    normalizeUsername(
      username
    );


  if (
    normalized ===
      "saftpresse040" ||
    normalized ===
      "thcliquide"
  ) {

    user.classList.add(
      "adminName"
    );

  }


  user.textContent =
    getDisplayName(username);


  const messageText =
    document.createElement(
      "div"
    );

  messageText.textContent =
    text;


  wrapper.appendChild(
    user
  );

  wrapper.appendChild(
    messageText
  );


  document.getElementById(
    "messages"
  ).appendChild(
    wrapper
  );


  scrollMessages();

}


function scrollMessages() {

  const messages =
    document.getElementById(
      "messages"
    );

  messages.scrollTop =
    messages.scrollHeight;

}


function searchFriends() {

  const search =
    document.getElementById(
      "search"
    )
    .value
    .toLowerCase();


  document
    .querySelectorAll(
      ".friend"
    )
    .forEach(
      friend => {

        const name =
          friend
            .querySelector(
              ".friendName"
            )
            .textContent
            .toLowerCase();


        friend.style.display =
          name.includes(search)
            ? "flex"
            : "none";

      }
    );

}


function changeProfileImage(event) {

  const file =
    event.target.files[0];

  if (!file) {
    return;
  }


  if (
    file.size >
    3 * 1024 * 1024
  ) {

    alert(
      "Das Bild darf maximal 3 MB groß sein."
    );

    return;
  }


  const reader =
    new FileReader();


  reader.onload =
    function(e) {

      const image =
        e.target.result;


      document.getElementById(
        "profileImage"
      ).src =
        image;


      localStorage.setItem(
        "profileImage",
        image
      );


      if (
        socket &&
        socket.readyState ===
        WebSocket.OPEN
      ) {

        socket.send(
          JSON.stringify({
            type:
              "saveProfileImage",
            image
          })
        );

      }

    };


  reader.readAsDataURL(
    file
  );

}


function resetPassword() {

  const password =
    document.getElementById(
      "resetPasswordInput"
    ).value;


  if (!resetToken) {

    document.getElementById(
      "resetError"
    ).textContent =
      "Kein gültiger Reset-Link.";

    return;
  }


  if (password.length < 8) {

    document.getElementById(
      "resetError"
    ).textContent =
      "Das Passwort muss mindestens 8 Zeichen haben.";

    return;
  }


  socket.send(
    JSON.stringify({
      type:
        "resetPassword",
      token:
        resetToken,
      password
    })
  );

}


function checkResetLink() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const token =
    params.get("reset");


  if (!token) {
    return false;
  }


  resetToken =
    token;


  document.getElementById(
    "accessScreen"
  ).style.display =
    "none";

  document.getElementById(
    "loginScreen"
  ).style.display =
    "none";

  document.getElementById(
    "registerScreen"
  ).style.display =
    "none";

  document.getElementById(
    "resetScreen"
  ).style.display =
    "flex";


  return true;

}


document
  .getElementById(
    "messageInput"
  )
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key ===
        "Enter"
      ) {

        sendMessage();

      }

    }
  );


const savedImage =
  localStorage.getItem(
    "profileImage"
  );


if (savedImage) {

  document.getElementById(
    "profileImage"
  ).src =
    savedImage;

}


connectSocket();


setTimeout(() => {

  const loggedIn =
    localStorage.getItem(
      "username"
    );

  if (
    loggedIn &&
    !checkResetLink()
  ) {

    showApp();

  } else {

    checkResetLink();

    if (
      !loggedIn &&
      !window.location.search.includes(
        "reset="
      )
    ) {

      document.getElementById(
        "accessScreen"
      ).style.display =
        "flex";

    }

  }

}, 500);

</script>

</body>
</html>

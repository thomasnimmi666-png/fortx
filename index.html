<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color"
      content="#000000">

<title>FORTX</title>

<style>

* {
  box-sizing: border-box;
}

:root {
  --bg: #000;
  --panel: #080808;
  --panel2: #111;
  --border: #242424;
  --text: #fff;
  --muted: #858585;
  --bubble: #151515;
  --bubbleMe: #fff;
  --bubbleMeText: #000;
}

body.light {
  --bg: #f4f4f4;
  --panel: #fff;
  --panel2: #eee;
  --border: #d5d5d5;
  --text: #050505;
  --muted: #666;
  --bubble: #e8e8e8;
  --bubbleMe: #000;
  --bubbleMeText: #fff;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: var(--text);

  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body {
  overflow: hidden;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

/* =========================
   AUTH
========================= */

#auth {
  width: 100%;
  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;

  background:
    radial-gradient(
      circle at 50% 20%,
      #191919 0,
      #050505 40%,
      #000 75%
    );
}

.auth-card {
  width: 100%;
  max-width: 420px;

  background: rgba(8,8,8,.96);

  border:
    1px solid #292929;

  border-radius: 26px;

  padding: 32px;

  box-shadow:
    0 30px 100px rgba(0,0,0,.7);
}

.logo {
  text-align: center;

  font-size: 46px;
  font-weight: 950;

  letter-spacing: 9px;

  margin-bottom: 7px;
}

.logo-sub {
  text-align: center;

  color: #777;

  margin-bottom: 28px;
}

.auth-tabs {
  display: flex;
  gap: 8px;

  margin-bottom: 18px;
}

.auth-tabs button {
  flex: 1;

  padding: 12px;

  border:
    1px solid #292929;

  border-radius: 12px;

  background: #0c0c0c;

  color: #888;
}

.auth-tabs button.active {
  background: #fff;
  color: #000;
}

.field {
  margin-bottom: 12px;
}

.field input {
  width: 100%;

  padding: 15px 16px;

  border:
    1px solid #292929;

  border-radius: 14px;

  background: #050505;

  color: #fff;

  outline: none;
}

.field input:focus {
  border-color: #fff;
}

.primary {
  width: 100%;

  padding: 15px;

  border: 0;

  border-radius: 14px;

  background: #fff;

  color: #000;

  font-weight: 850;
}

.secondary {
  width: 100%;

  padding: 13px;

  border:
    1px solid #333;

  border-radius: 14px;

  background: transparent;

  color: var(--text);
}

.forgot {
  text-align: center;

  margin-top: 16px;

  color: #aaa;

  cursor: pointer;

  font-size: 14px;
}

.message {
  margin-top: 14px;

  padding: 12px;

  border-radius: 12px;

  background: #171717;

  color: #ddd;

  font-size: 14px;
}

/* =========================
   APP
========================= */

#app {
  width: 100%;
  height: 100vh;

  display: grid;

  grid-template-columns:
    290px 1fr;

  overflow: hidden;
}

.sidebar {
  border-right:
    1px solid var(--border);

  background:
    var(--panel);

  display: flex;

  flex-direction: column;
}

.brand {
  padding: 24px;

  font-size: 27px;

  font-weight: 950;

  letter-spacing: 5px;

  border-bottom:
    1px solid var(--border);
}

.me {
  padding: 18px 20px;

  border-bottom:
    1px solid var(--border);
}

.me-name {
  font-weight: 850;
}

.me-role {
  margin-top: 4px;

  font-size: 12px;

  color: var(--muted);
}

.section-title {
  padding:
    18px 18px 8px;

  color: var(--muted);

  font-size: 11px;

  text-transform: uppercase;

  letter-spacing: 1.5px;
}

.contacts {
  flex: 1;

  overflow-y: auto;

  padding-bottom: 5px;
}

.contact {
  padding: 13px 18px;

  margin: 4px 8px;

  border-radius: 13px;

  display: flex;

  align-items: center;

  gap: 12px;

  cursor: pointer;
}

.contact:hover,
.contact.active {
  background:
    var(--panel2);
}

.avatar {
  width: 39px;
  height: 39px;

  border-radius: 50%;

  background: #fff;

  color: #000;

  display: grid;

  place-items: center;

  font-weight: 900;

  flex-shrink: 0;
}

.contact-info {
  min-width: 0;
}

.contact-name {
  font-weight: 750;

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;
}

.contact-role {
  font-size: 11px;

  color: var(--muted);
}

.admin-badge {
  margin-left: 5px;

  font-size: 10px;
}

.bottom-nav {
  border-top:
    1px solid var(--border);

  padding: 10px;

  display: grid;

  gap: 6px;
}

.nav-btn {
  width: 100%;

  padding: 12px;

  background: transparent;

  border:
    1px solid transparent;

  color: var(--muted);

  border-radius: 12px;

  text-align: left;
}

.nav-btn:hover {
  background:
    var(--panel2);

  color: var(--text);
}

/* =========================
   CHAT
========================= */

.chat {
  min-width: 0;

  display: flex;

  flex-direction: column;

  background:
    var(--bg);
}

.chat-header {
  height: 70px;

  flex-shrink: 0;

  border-bottom:
    1px solid var(--border);

  display: flex;

  align-items: center;

  padding: 0 22px;

  gap: 12px;
}

.chat-title {
  font-weight: 850;

  font-size: 18px;
}

.chat-status {
  color: var(--muted);

  font-size: 12px;

  margin-top: 2px;
}

.messages {
  flex: 1;

  overflow-y: auto;

  padding: 22px;

  display: flex;

  flex-direction: column;

  gap: 9px;
}

.empty {
  margin: auto;

  color: var(--muted);

  text-align: center;
}

.msg-row {
  display: flex;
}

.msg-row.me {
  justify-content: flex-end;
}

.msg {
  max-width:
    min(72%, 650px);

  padding:
    10px 13px;

  border-radius: 17px;

  background:
    var(--bubble);

  border:
    1px solid var(--border);

  overflow-wrap: anywhere;
}

.msg-row.me .msg {
  background:
    var(--bubbleMe);

  color:
    var(--bubbleMeText);

  border: 0;
}

.msg-user {
  font-size: 11px;

  font-weight: 800;

  opacity: .65;

  margin-bottom: 3px;
}

.msg-time {
  font-size: 9px;

  opacity: .45;

  margin-top: 5px;
}

.msg-image {
  display: block;

  max-width: 360px;
  max-height: 420px;

  border-radius: 12px;

  margin-bottom: 6px;

  cursor: pointer;
}

.composer {
  padding: 12px;

  border-top:
    1px solid var(--border);

  display: flex;

  gap: 8px;

  background:
    var(--bg);
}

.composer input[type="text"] {
  flex: 1;

  min-width: 0;

  border:
    1px solid var(--border);

  background:
    var(--panel);

  color:
    var(--text);

  padding: 14px;

  border-radius: 14px;

  outline: none;
}

.icon-btn {
  width: 48px;

  border:
    1px solid var(--border);

  background:
    var(--panel);

  color:
    var(--text);

  border-radius: 14px;

  font-size: 19px;
}

.send-btn {
  width: 55px;

  border: 0;

  background: #fff;

  color: #000;

  border-radius: 14px;

  font-weight: 900;
}

/* =========================
   MODALS
========================= */

.modal {
  position: fixed;

  inset: 0;

  background:
    rgba(0,0,0,.75);

  display: grid;

  place-items: center;

  padding: 20px;

  z-index: 50;
}

.modal-card {
  width: 100%;

  max-width: 430px;

  max-height: 85vh;

  overflow-y: auto;

  background:
    var(--panel);

  border:
    1px solid var(--border);

  border-radius: 22px;

  padding: 24px;
}

.modal-title {
  font-size: 21px;

  font-weight: 900;

  margin-bottom: 18px;
}

.setting {
  padding: 15px 0;

  border-bottom:
    1px solid var(--border);
}

.setting label {
  display: flex;

  justify-content:
    space-between;

  align-items: center;
}

.close {
  margin-top: 18px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 760px) {

  #app {
    grid-template-columns:
      1fr;
  }

  .sidebar {
    display: none;
  }

  .msg {
    max-width: 85%;
  }

  .chat-header {
    padding: 0 15px;
  }

  .messages {
    padding: 15px;
  }

  .composer {
    padding:
      8px;
  }

  .icon-btn {
    width: 44px;
  }

  .send-btn {
    width: 48px;
  }
}

</style>
</head>

<body>

<!-- =========================
     AUTH
========================= -->

<section id="auth">

  <div class="auth-card">

    <div class="logo">
      FORTX
    </div>

    <div class="logo-sub">
      Private Messenger
    </div>

    <div class="auth-tabs">

      <button
        id="loginTab"
        class="active"
        onclick="showAuth('login')">
        Login
      </button>

      <button
        id="registerTab"
        onclick="showAuth('register')">
        Registrieren
      </button>

    </div>

    <div id="loginForm">

      <div class="field">

        <input
          id="loginUsername"
          placeholder="Benutzername"
          autocomplete="username">

      </div>

      <div class="field">

        <input
          id="loginPassword"
          type="password"
          placeholder="Passwort"
          autocomplete="current-password">

      </div>

      <button
        class="primary"
        onclick="login()">

        Einloggen

      </button>

      <div
        class="forgot"
        onclick="showForgot()">

        Passwort vergessen?

      </div>

    </div>

    <div
      id="registerForm"
      class="hidden">

      <div class="field">

        <input
          id="registerUsername"
          placeholder="Benutzername"
          autocomplete="username">

      </div>

      <div class="field">

        <input
          id="registerPassword"
          type="password"
          placeholder="Passwort"
          autocomplete="new-password">

      </div>

      <div class="field">

        <input
          id="registerAccess"
          placeholder="Zugangscode">

      </div>

      <button
        class="primary"
        onclick="register()">

        Konto erstellen

      </button>

    </div>

    <div
      id="authMessage"
      class="message hidden">
    </div>

  </div>

</section>


<!-- =========================
     APP
========================= -->

<section
  id="app"
  class="hidden">

  <aside class="sidebar">

    <div class="brand">
      FORTX
    </div>

    <div class="me">

      <div
        id="myName"
        class="me-name">
        -
      </div>

      <div
        id="myRole"
        class="me-role">
        Mitglied
      </div>

    </div>

    <div class="section-title">
      Chats
    </div>

    <div
      id="contacts"
      class="contacts">
    </div>

    <div class="bottom-nav">

      <button
        class="nav-btn"
        onclick="openSettings()">

        ⚙️ Einstellungen

      </button>

      <button
        id="adminUsersBtn"
        class="nav-btn hidden"
        onclick="showUsers()">

        👑 Benutzer

      </button>

      <button
        class="nav-btn"
        onclick="logout()">

        🚪 Abmelden

      </button>

    </div>

  </aside>


  <main class="chat">

    <header class="chat-header">

      <div
        class="avatar"
        id="chatAvatar">
        👥
      </div>

      <div>

        <div
          id="chatTitle"
          class="chat-title">

          Allgemein

        </div>

        <div
          id="chatStatus"
          class="chat-status">

          Gruppenchat

        </div>

      </div>

    </header>


    <div
      id="messages"
      class="messages">

      <div class="empty">
        Noch keine Nachrichten
      </div>

    </div>


    <div class="composer">

      <input
        id="imageInput"
        type="file"
        accept="image/jpeg,image/png,image/gif,image/webp"
        hidden
        onchange="sendImage()">

      <button
        class="icon-btn"
        onclick="openImagePicker()"
        title="Bild senden">

        🖼️

      </button>

      <input
        id="messageInput"
        type="text"
        placeholder="Nachricht schreiben..."
        autocomplete="off"
        onkeydown="handleEnter(event)">

      <button
        class="send-btn"
        onclick="sendMessage()">

        ➤

      </button>

    </div>

  </main>

</section>


<!-- =========================
     SETTINGS
========================= -->

<div
  id="settingsModal"
  class="modal hidden">

  <div class="modal-card">

    <div class="modal-title">
      Einstellungen
    </div>

    <div class="setting">

      <label>

        <span>
          Darstellung
        </span>

        <select
          id="themeSelect"
          onchange="changeTheme()"
          style="
            background:var(--panel2);
            color:var(--text);
            border:1px solid var(--border);
            border-radius:10px;
            padding:8px;
          ">

          <option value="dark">
            Dunkel
          </option>

          <option value="light">
            Hell
          </option>

        </select>

      </label>

    </div>

    <button
      class="secondary close"
      onclick="closeSettings()">

      Schließen

    </button>

  </div>

</div>


<!-- =========================
     FORGOT
========================= -->

<div
  id="forgotModal"
  class="modal hidden">

  <div class="modal-card">

    <div class="modal-title">
      Passwort vergessen
    </div>

    <div class="field">

      <input
        id="forgotUsername"
        placeholder="Benutzername">

    </div>

    <button
      class="primary"
      onclick="forgotPassword()">

      Anfrage senden

    </button>

    <button
      class="secondary close"
      onclick="closeForgot()">

      Abbrechen

    </button>

  </div>

</div>


<!-- =========================
     USERS
========================= -->

<div
  id="usersModal"
  class="modal hidden">

  <div class="modal-card">

    <div class="modal-title">
      👑 Benutzer
    </div>

    <div id="usersList">
    </div>

    <button
      class="secondary close"
      onclick="closeUsers()">

      Schließen

    </button>

  </div>

</div>


<script>

let ws = null;

let me = null;

let isAdminUser = false;

let currentChat = "general";

let friends = [];

let reconnectTimer = null;

const ADMIN_NAMES = [
  "saftpresse040",
  "thcliquide"
];


/* =========================
   SOCKET
========================= */

function getSocketUrl() {

  const protocol =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";

  return (
    protocol +
    "//" +
    location.host
  );
}

function connect() {

  if (
    ws &&
    (
      ws.readyState === WebSocket.OPEN ||
      ws.readyState === WebSocket.CONNECTING
    )
  ) {
    return;
  }

  ws = new WebSocket(
    getSocketUrl()
  );

  ws.onopen = () => {

    console.log(
      "FORTX verbunden"
    );

  };

  ws.onmessage = event => {

    try {

      const data =
        JSON.parse(
          event.data
        );

      handleServer(data);

    } catch (error) {

      console.error(
        "Nachricht konnte nicht gelesen werden:",
        error
      );

    }
  };

  ws.onerror = error => {

    console.error(
      "WebSocket Fehler:",
      error
    );

  };

  ws.onclose = () => {

    console.log(
      "FORTX Verbindung getrennt"
    );

    clearTimeout(
      reconnectTimer
    );

    reconnectTimer =
      setTimeout(
        connect,
        2000
      );

  };
}

function send(data) {

  if (
    ws &&
    ws.readyState ===
      WebSocket.OPEN
  ) {

    ws.send(
      JSON.stringify(data)
    );

    return true;
  }

  showAuthMessage(
    "Keine Verbindung zum Server."
  );

  return false;
}


/* =========================
   SERVER
========================= */

function handleServer(data) {

  console.log(
    "SERVER:",
    data
  );

  if (
    data.type ===
    "error"
  ) {

    showAuthMessage(
      data.text
    );

    return;
  }


  if (
    data.type ===
      "registered" ||
    data.type ===
      "loggedIn"
  ) {

    enterApp(
      data.username,
      data.isAdmin
    );

    return;
  }


  if (
    data.type ===
    "forgotPasswordSent"
  ) {

    alert(
      data.text
    );

    closeForgot();

    return;
  }


  if (
    data.type ===
    "passwordResetRequest"
  ) {

    if (isAdminUser) {

      alert(
        "Passwort-Reset angefragt für: " +
        data.username
      );

    }

    return;
  }


  if (
    data.type ===
    "passwordResetLink"
  ) {

    prompt(
      "Reset-Link für " +
      data.username +
      ":",
      data.resetUrl
    );

    return;
  }


  if (
    data.type ===
    "passwordResetSuccess"
  ) {

    alert(
      "Passwort erfolgreich geändert."
    );

    return;
  }


  if (
    data.type ===
    "friends"
  ) {

    friends =
      data.friends || [];

    renderContacts();

    return;
  }


  if (
    data.type ===
    "friendAdded"
  ) {

    send({
      type:
        "getFriends"
    });

    return;
  }


  if (
    data.type ===
    "groupMessages"
  ) {

    if (
      currentChat ===
      "general"
    ) {

      renderMessages(
        data.messages || [],
        true
      );

    }

    return;
  }


  if (
    data.type ===
    "privateMessages"
  ) {

    if (
      currentChat ===
      data.username
    ) {

      renderMessages(
        data.messages || [],
        false
      );

    }

    return;
  }


  if (
    data.type ===
    "groupMessage"
  ) {

    if (
      currentChat ===
      "general"
    ) {

      appendMessage(
        data.message,
        true
      );

    }

    return;
  }


  if (
    data.type ===
    "message"
  ) {

    if (
      currentChat === data.from ||
      currentChat === data.to
    ) {

      appendMessage(
        {
          from:
            data.from,

          to:
            data.to,

          text:
            data.text,

          imageUrl:
            data.imageUrl,

          time:
            data.time
        },
        false
      );

    }

    return;
  }


  if (
    data.type ===
    "imageUploaded"
  ) {

    if (
      data.target ===
      "general"
    ) {

      send({
        type:
          "groupMessage",

        imageUrl:
          data.url
      });

    } else {

      send({
        type:
          "message",

        to:
          data.target,

        imageUrl:
          data.url
      });

    }

    return;
  }


  if (
    data.type ===
    "users"
  ) {

    renderUsers(
      data.users || []
    );

    return;
  }
}


/* =========================
   APP
========================= */

function enterApp(
  username,
  admin
) {

  me =
    username;

  isAdminUser =
    !!admin;

  document
    .getElementById("auth")
    .classList.add(
      "hidden"
    );

  document
    .getElementById("app")
    .classList.remove(
      "hidden"
    );

  document
    .getElementById("myName")
    .textContent =
      username;

  document
    .getElementById("myRole")
    .textContent =
      isAdminUser
        ? "👑 Admin"
        : "Mitglied";

  document
    .getElementById("adminUsersBtn")
    .classList.toggle(
      "hidden",
      !isAdminUser
    );

  send({
    type:
      "getFriends"
  });

  openGeneral();
}


/* =========================
   AUTH
========================= */

function showAuth(type) {

  const login =
    type === "login";

  document
    .getElementById("loginForm")
    .classList.toggle(
      "hidden",
      !login
    );

  document
    .getElementById("registerForm")
    .classList.toggle(
      "hidden",
      login
    );

  document
    .getElementById("loginTab")
    .classList.toggle(
      "active",
      login
    );

  document
    .getElementById("registerTab")
    .classList.toggle(
      "active",
      !login
    );

  document
    .getElementById("authMessage")
    .classList.add(
      "hidden"
    );
}

function login() {

  send({

    type:
      "login",

    username:
      document
        .getElementById(
          "loginUsername"
        )
        .value,

    password:
      document
        .getElementById(
          "loginPassword"
        )
        .value
  });
}

function register() {

  send({

    type:
      "register",

    username:
      document
        .getElementById(
          "registerUsername"
        )
        .value,

    password:
      document
        .getElementById(
          "registerPassword"
        )
        .value,

    accessCode:
      document
        .getElementById(
          "registerAccess"
        )
        .value
  });
}

function showForgot() {

  document
    .getElementById(
      "forgotModal"
    )
    .classList.remove(
      "hidden"
    );
}

function closeForgot() {

  document
    .getElementById(
      "forgotModal"
    )
    .classList.add(
      "hidden"
    );
}

function forgotPassword() {

  send({

    type:
      "forgotPassword",

    username:
      document
        .getElementById(
          "forgotUsername"
        )
        .value
  });
}

function showAuthMessage(text) {

  const box =
    document.getElementById(
      "authMessage"
    );

  box.textContent =
    text;

  box.classList.remove(
    "hidden"
  );
}


/* =========================
   CONTACTS
========================= */

function renderContacts() {

  const container =
    document.getElementById(
      "contacts"
    );

  container.innerHTML = "";

  addContact(
    "general",
    "Allgemein",
    "👥",
    true
  );

  for (
    const username of friends
  ) {

    if (
      username === me
    ) {
      continue;
    }

    addContact(
      username,
      username,
      ADMIN_NAMES.includes(
        username
      )
        ? "👑"
        : username
            .charAt(0)
            .toUpperCase(),
      false
    );
  }
}

function addContact(
  id,
  name,
  avatar,
  general
) {

  const el =
    document.createElement(
      "div"
    );

  el.className =
    "contact";

  if (
    currentChat === id
  ) {

    el.classList.add(
      "active"
    );
  }

  const admin =
    ADMIN_NAMES.includes(
      name
    );

  el.innerHTML = `

    <div class="avatar">
      ${escapeHtml(avatar)}
    </div>

    <div class="contact-info">

      <div class="contact-name">

        ${escapeHtml(name)}

        ${
          admin
            ? '<span class="admin-badge">👑</span>'
            : ""
        }

      </div>

      <div class="contact-role">

        ${
          general
            ? "Gruppenchat"
            : admin
              ? "Admin"
              : "Kontakt"
        }

      </div>

    </div>
  `;

  el.onclick = () => {

    if (general) {

      openGeneral();

    } else {

      openPrivate(
        name
      );

    }
  };

  container.appendChild(
    el
  );
}


/* =========================
   GENERAL
========================= */

function openGeneral() {

  currentChat =
    "general";

  document
    .getElementById(
      "chatTitle"
    )
    .textContent =
      "Allgemein";

  document
    .getElementById(
      "chatStatus"
    )
    .textContent =
      isAdminUser
        ? "Du kannst schreiben"
        : "Nur Lesen";

  document
    .getElementById(
      "chatAvatar"
    )
    .textContent =
      "👥";

  document
    .getElementById(
      "messages"
    )
    .innerHTML = "";

  renderContacts();

  send({
    type:
      "getGroupMessages"
  });
}


/* =========================
   PRIVATE
========================= */

function openPrivate(
  username
) {

  currentChat =
    username;

  document
    .getElementById(
      "chatTitle"
    )
    .textContent =
      username;

  document
    .getElementById(
      "chatStatus"
    )
    .textContent =
      ADMIN_NAMES.includes(
        username
      )
        ? "👑 Admin"
        : "Kontakt";

  document
    .getElementById(
      "chatAvatar"
    )
    .textContent =
      ADMIN_NAMES.includes(
        username
      )
        ? "👑"
        : username
            .charAt(0)
            .toUpperCase();

  document
    .getElementById(
      "messages"
    )
    .innerHTML = "";

  renderContacts();

  send({

    type:
      "getPrivateMessages",

    username
  });
}


/* =========================
   MESSAGES
========================= */

function renderMessages(
  messages,
  group
) {

  const container =
    document.getElementById(
      "messages"
    );

  container.innerHTML = "";

  if (!messages.length) {

    container.innerHTML =
      '<div class="empty">Noch keine Nachrichten</div>';

    return;
  }

  messages.forEach(
    message => {

      appendMessage(
        message,
        group,
        false
      );

    }
  );

  scrollBottom();
}

function appendMessage(
  message,
  group,
  scroll = true
) {

  const container =
    document.getElementById(
      "messages"
    );

  const empty =
    container.querySelector(
      ".empty"
    );

  if (empty) {
    empty.remove();
  }

  const sender =
    group
      ? message.username
      : message.from;

  const mine =
    sender === me;

  const row =
    document.createElement(
      "div"
    );

  row.className =
    "msg-row" +
    (
      mine
        ? " me"
        : ""
    );

  const box =
    document.createElement(
      "div"
    );

  box.className =
    "msg";

  if (
    group &&
    !mine
  ) {

    const name =
      document.createElement(
        "div"
      );

    name.className =
      "msg-user";

    name.textContent =
      sender +
      (
        ADMIN_NAMES.includes(
          sender
        )
          ? " 👑"
          : ""
      );

    box.appendChild(
      name
    );
  }

  if (
    message.imageUrl
  ) {

    const img =
      document.createElement(
        "img"
      );

    img.className =
      "msg-image";

    img.src =
      message.imageUrl;

    img.loading =
      "lazy";

    img.alt =
      "Bild";

    img.onclick = () => {

      window.open(
        message.imageUrl,
        "_blank"
      );

    };

    box.appendChild(
      img
    );
  }

  if (
    message.text
  ) {

    const text =
      document.createElement(
        "div"
      );

    text.textContent =
      message.text;

    box.appendChild(
      text
    );
  }

  const time =
    document.createElement(
      "div"
    );

  time.className =
    "msg-time";

  time.textContent =
    formatTime(
      message.time
    );

  box.appendChild(
    time
  );

  row.appendChild(
    box
  );

  container.appendChild(
    row
  );

  if (scroll) {
    scrollBottom();
  }
}


/* =========================
   SEND TEXT
========================= */

function sendMessage() {

  const input =
    document.getElementById(
      "messageInput"
    );

  const text =
    input.value.trim();

  if (!text) {
    return;
  }

  if (
    currentChat ===
    "general"
  ) {

    if (!isAdminUser) {

      alert(
        "Nur die Admins können im Allgemein-Chat schreiben."
      );

      return;
    }

    send({

      type:
        "groupMessage",

      text

    });

  } else {

    send({

      type:
        "message",

      to:
        currentChat,

      text

    });
  }

  input.value = "";
}


/* =========================
   SEND IMAGE
========================= */

function openImagePicker() {

  document
    .getElementById(
      "imageInput"
    )
    .click();
}

function sendImage() {

  const input =
    document.getElementById(
      "imageInput"
    );

  const file =
    input.files[0];

  if (!file) {
    return;
  }

  if (
    file.size >
    8 * 1024 * 1024
  ) {

    alert(
      "Das Bild darf maximal 8 MB groß sein."
    );

    input.value = "";

    return;
  }

  const allowed = [
    "image/jpeg",
    "image/png",
    "image/gif",
    "image/webp"
  ];

  if (
    !allowed.includes(
      file.type
    )
  ) {

    alert(
      "Dieses Bildformat wird nicht unterstützt."
    );

    input.value = "";

    return;
  }

  if (
    currentChat ===
      "general" &&
    !isAdminUser
  ) {

    alert(
      "Nur die Admins können im Allgemein-Chat Bilder senden."
    );

    input.value = "";

    return;
  }

  const reader =
    new FileReader();

  reader.onload = () => {

    send({

      type:
        "uploadImage",

      image:
        reader.result,

      target:
        currentChat
    });

  };

  reader.onerror = () => {

    alert(
      "Das Bild konnte nicht gelesen werden."
    );

  };

  reader.readAsDataURL(
    file
  );

  input.value = "";
}


/* =========================
   ENTER
========================= */

function handleEnter(
  event
) {

  if (
    event.key === "Enter" &&
    !event.shiftKey
  ) {

    event.preventDefault();

    sendMessage();
  }
}


/* =========================
   HELPERS
========================= */

function scrollBottom() {

  const box =
    document.getElementById(
      "messages"
    );

  box.scrollTop =
    box.scrollHeight;
}

function formatTime(time) {

  if (!time) {
    return "";
  }

  return new Date(
    Number(time)
  ).toLocaleTimeString(
    "de-DE",
    {
      hour:
        "2-digit",

      minute:
        "2-digit"
    }
  );
}


/* =========================
   SETTINGS
========================= */

function openSettings() {

  const saved =
    localStorage.getItem(
      "fortx-theme"
    ) || "dark";

  document
    .getElementById(
      "themeSelect"
    )
    .value =
      saved;

  document
    .getElementById(
      "settingsModal"
    )
    .classList.remove(
      "hidden"
    );
}

function closeSettings() {

  document
    .getElementById(
      "settingsModal"
    )
    .classList.add(
      "hidden"
    );
}

function changeTheme() {

  const theme =
    document
      .getElementById(
        "themeSelect"
      )
      .value;

  document.body.classList.toggle(
    "light",
    theme === "light"
  );

  localStorage.setItem(
    "fortx-theme",
    theme
  );
}


/* =========================
   ADMIN USERS
========================= */

function showUsers() {

  if (!isAdminUser) {
    return;
  }

  document
    .getElementById(
      "usersModal"
    )
    .classList.remove(
      "hidden"
    );

  send({
    type:
      "getUsers"
  });
}

function closeUsers() {

  document
    .getElementById(
      "usersModal"
    )
    .classList.add(
      "hidden"
    );
}

function renderUsers(
  users
) {

  const list =
    document.getElementById(
      "usersList"
    );

  list.innerHTML = "";

  if (!users.length) {

    list.innerHTML =
      '<div class="empty">Keine Benutzer vorhanden.</div>';

    return;
  }

  users.forEach(
    user => {

      const row =
        document.createElement(
          "div"
        );

      row.style.cssText = `
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:10px;
        padding:12px 0;
        border-bottom:1px solid var(--border);
      `;

      const name =
        document.createElement(
          "span"
        );

      name.textContent =
        user.username;

      if (
        ADMIN_NAMES.includes(
          user.username
        )
      ) {

        name.textContent +=
          " 👑";
      }

      const reset =
        document.createElement(
          "button"
        );

      reset.textContent =
        "Reset";

      reset.style.cssText = `
        border:1px solid var(--border);
        background:var(--panel2);
        color:var(--text);
        border-radius:9px;
        padding:7px 10px;
      `;

      reset.onclick = () => {

        send({

          type:
            "createPasswordReset",

          username:
            user.username

        });

      };

      row.appendChild(
        name
      );

      row.appendChild(
        reset
      );

      list.appendChild(
        row
      );
    }
  );
}


/* =========================
   LOGOUT
========================= */

function logout() {

  me = null;

  isAdminUser = false;

  currentChat =
    "general";

  friends = [];

  if (ws) {

    try {
      ws.close();
    } catch {}

  }

  location.reload();
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(
  value
) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );
}


/* =========================
   THEME
========================= */

const savedTheme =
  localStorage.getItem(
    "fortx-theme"
  ) || "dark";

document.body.classList.toggle(
  "light",
  savedTheme === "light"
);


/* =========================
   START
========================= */

connect();


/* =========================
   RESET LINK
========================= */

const resetToken =
  new URLSearchParams(
    location.search
  ).get("reset");

if (resetToken) {

  setTimeout(
    () => {

      const password =
        prompt(
          "Neues Passwort eingeben (mindestens 8 Zeichen):"
        );

      if (
        password &&
        password.length >= 8
      ) {

        send({

          type:
            "resetPassword",

          token:
            resetToken,

          password

        });

      } else if (password) {

        alert(
          "Das Passwort muss mindestens 8 Zeichen haben."
        );

      }

    },
    1000
  );
}

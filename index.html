<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>FortX</title>

  <style>
    :root {
      --bg: #000;
      --panel: #0b0b0b;
      --panel2: #111;
      --border: #252525;
      --text: #fff;
      --muted: #8c8c8c;
      --accent: #fff;
      --bubble: #161616;
      --danger: #ff4545;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       LOGIN
    ========================= */

    #authScreen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background:
        radial-gradient(circle at top, #151515 0%, #000 45%);
    }

    .auth-box {
      width: 100%;
      max-width: 420px;
      background: rgba(10,10,10,.96);
      border: 1px solid #292929;
      border-radius: 24px;
      padding: 32px 25px;
      box-shadow: 0 25px 80px rgba(0,0,0,.8);
    }

    .logo {
      text-align: center;
      font-size: 48px;
      font-weight: 900;
      letter-spacing: -3px;
      margin-bottom: 6px;
      color: white;
      text-shadow:
        0 0 8px rgba(255,255,255,.45),
        0 0 30px rgba(255,255,255,.15);
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 28px;
    }

    .tabs {
      display: flex;
      background: #080808;
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 4px;
      margin-bottom: 20px;
    }

    .tab {
      flex: 1;
      border: 0;
      background: transparent;
      color: #777;
      padding: 11px;
      border-radius: 9px;
    }

    .tab.active {
      background: #fff;
      color: #000;
      font-weight: 700;
    }

    .field {
      margin-bottom: 13px;
    }

    .field label {
      display: block;
      color: #aaa;
      font-size: 13px;
      margin: 0 0 7px 3px;
    }

    .field input {
      width: 100%;
      background: #080808;
      border: 1px solid #292929;
      color: white;
      outline: none;
      border-radius: 12px;
      padding: 14px;
    }

    .field input:focus {
      border-color: #777;
    }

    .main-btn {
      width: 100%;
      border: 0;
      background: white;
      color: black;
      font-weight: 800;
      border-radius: 12px;
      padding: 14px;
      margin-top: 4px;
    }

    .secondary-btn {
      width: 100%;
      border: 1px solid #303030;
      background: #0b0b0b;
      color: white;
      border-radius: 12px;
      padding: 13px;
      margin-top: 10px;
    }

    .link-btn {
      display: block;
      border: 0;
      background: transparent;
      color: #aaa;
      margin: 16px auto 0;
      font-size: 13px;
    }

    .link-btn:hover {
      color: white;
    }

    #authMessage {
      min-height: 20px;
      text-align: center;
      color: #aaa;
      font-size: 13px;
      margin-top: 15px;
    }

    /* =========================
       APP
    ========================= */

    #app {
      height: 100vh;
      display: flex;
      background: #000;
    }

    .sidebar {
      width: 280px;
      background: #050505;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .brand {
      padding: 22px;
      border-bottom: 1px solid var(--border);
    }

    .brand-title {
      font-size: 27px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .brand-user {
      color: #777;
      font-size: 13px;
      margin-top: 4px;
    }

    .nav {
      padding: 12px;
      flex: 1;
      overflow-y: auto;
    }

    .nav-title {
      color: #555;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 10px;
    }

    .chat-item {
      width: 100%;
      border: 0;
      background: transparent;
      color: white;
      padding: 12px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 11px;
      text-align: left;
      margin-bottom: 3px;
    }

    .chat-item:hover,
    .chat-item.active {
      background: #151515;
    }

    .avatar {
      width: 39px;
      height: 39px;
      border-radius: 50%;
      background: #181818;
      border: 1px solid #303030;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      flex-shrink: 0;
    }

    .chat-info {
      min-width: 0;
    }

    .chat-name {
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-sub {
      color: #666;
      font-size: 11px;
      margin-top: 3px;
    }

    .sidebar-bottom {
      padding: 12px;
      border-top: 1px solid var(--border);
    }

    .side-btn {
      width: 100%;
      background: transparent;
      color: #aaa;
      border: 0;
      text-align: left;
      padding: 11px;
      border-radius: 10px;
    }

    .side-btn:hover {
      background: #111;
      color: white;
    }

    /* =========================
       CHAT
    ========================= */

    .chat {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      height: 72px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
      background: #030303;
    }

    .mobile-menu {
      display: none;
      background: transparent;
      color: white;
      border: 0;
      font-size: 23px;
    }

    .header-title {
      font-size: 17px;
      font-weight: 800;
    }

    .header-status {
      color: #666;
      font-size: 12px;
      margin-top: 2px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      scroll-behavior: smooth;
    }

    .empty {
      margin: auto;
      color: #555;
      text-align: center;
    }

    .message {
      max-width: 75%;
      display: flex;
      flex-direction: column;
      align-self: flex-start;
    }

    .message.mine {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message-user {
      font-size: 11px;
      color: #777;
      margin: 0 8px 4px;
    }

    .bubble {
      background: var(--bubble);
      border: 1px solid #242424;
      border-radius: 16px;
      padding: 10px 13px;
      line-height: 1.4;
      word-break: break-word;
    }

    .mine .bubble {
      background: white;
      color: black;
      border-color: white;
    }

    .message-time {
      color: #555;
      font-size: 10px;
      margin: 4px 8px 0;
    }

    .composer {
      border-top: 1px solid var(--border);
      padding: 13px;
      background: #030303;
      display: flex;
      gap: 9px;
    }

    .composer input {
      flex: 1;
      min-width: 0;
      background: #0c0c0c;
      border: 1px solid #292929;
      color: white;
      outline: none;
      border-radius: 13px;
      padding: 13px;
    }

    .send-btn {
      width: 48px;
      border: 0;
      border-radius: 13px;
      background: white;
      color: black;
      font-weight: 900;
    }

    .composer.readonly {
      opacity: .55;
    }

    /* =========================
       ADMIN NAME
    ========================= */

    .admin-name {
      font-weight: 900;
      display: inline-block;
      background: linear-gradient(
        90deg,
        #fff,
        #777,
        #fff,
        #aaa,
        #fff
      );
      background-size: 300% auto;
      color: transparent;
      background-clip: text;
      -webkit-background-clip: text;
      animation: adminGlow 3s linear infinite;
    }

    @keyframes adminGlow {
      0% {
        background-position: 0% center;
      }
      100% {
        background-position: 300% center;
      }
    }

    /* =========================
       MODALS
    ========================= */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.78);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-box {
      width: 100%;
      max-width: 430px;
      background: #0b0b0b;
      border: 1px solid #292929;
      border-radius: 20px;
      padding: 23px;
      box-shadow: 0 25px 80px #000;
    }

    .modal-title {
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .modal-close {
      float: right;
      background: transparent;
      color: #777;
      border: 0;
      font-size: 20px;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid #1d1d1d;
    }

    .setting-name {
      font-weight: 700;
    }

    .setting-desc {
      color: #666;
      font-size: 12px;
      margin-top: 4px;
    }

    .switch {
      width: 50px;
      height: 28px;
      border-radius: 30px;
      border: 1px solid #333;
      background: #181818;
      position: relative;
      cursor: pointer;
    }

    .switch::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: white;
      top: 3px;
      left: 4px;
      transition: .2s;
    }

    body.light {
      --bg: #f5f5f5;
      --panel: #fff;
      --panel2: #eee;
      --border: #ddd;
      --text: #111;
      --muted: #666;
      --accent: #111;
      --bubble: #eee;
    }

    body.light #app,
    body.light .chat,
    body.light .sidebar,
    body.light .chat-header,
    body.light .composer,
    body.light .sidebar-bottom,
    body.light .brand {
      background: #fff;
      color: #111;
    }

    body.light .chat-item:hover,
    body.light .chat-item.active {
      background: #eee;
      color: #111;
    }

    body.light .composer input,
    body.light .field input {
      background: #f3f3f3;
      color: #111;
      border-color: #ccc;
    }

    body.light .bubble {
      background: #eee;
      color: #111;
      border-color: #ddd;
    }

    body.light .mine .bubble {
      background: #111;
      color: white;
    }

    body.light .switch {
      background: white;
    }

    body.light .switch::after {
      left: 25px;
      background: #111;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 760px) {
      .sidebar {
        position: fixed;
        z-index: 50;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-100%);
        transition: transform .2s ease;
        width: 280px;
        box-shadow: 20px 0 50px rgba(0,0,0,.5);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .mobile-menu {
        display: block;
      }

      .chat-header {
        padding: 0 12px;
      }

      #messages {
        padding: 14px 11px;
      }

      .message {
        max-width: 88%;
      }

      .auth-box {
        padding: 26px 19px;
      }

      .logo {
        font-size: 42px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       AUTH
  ========================= -->

  <section id="authScreen">

    <div class="auth-box">

      <div class="logo">FortX</div>
      <div class="subtitle">Privater Chat</div>

      <div class="tabs">
        <button
          id="loginTab"
          class="tab active"
          onclick="showLogin()">
          Anmelden
        </button>

        <button
          id="registerTab"
          class="tab"
          onclick="showRegister()">
          Registrieren
        </button>
      </div>

      <div id="loginForm">

        <div class="field">
          <label>Benutzername</label>
          <input
            id="loginUsername"
            autocomplete="username"
            placeholder="Benutzername">
        </div>

        <div class="field">
          <label>Passwort</label>
          <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            placeholder="Passwort">
        </div>

        <button
          class="main-btn"
          onclick="login()">
          Anmelden
        </button>

        <button
          class="link-btn"
          onclick="showForgot()">
          Passwort vergessen?
        </button>

      </div>

      <div id="registerForm" class="hidden">

        <div class="field">
          <label>Benutzername</label>
          <input
            id="registerUsername"
            autocomplete="username"
            placeholder="z. B. max123">
        </div>

        <div class="field">
          <label>Passwort</label>
          <input
            id="registerPassword"
            type="password"
            autocomplete="new-password"
            placeholder="Mindestens 8 Zeichen">
        </div>

        <div class="field">
          <label>Zugangscode</label>
          <input
            id="registerAccessCode"
            type="password"
            placeholder="Zugangscode">
        </div>

        <button
          class="main-btn"
          onclick="register()">
          Konto erstellen
        </button>

      </div>

      <div id="forgotForm" class="hidden">

        <div class="field">
          <label>Benutzername</label>
          <input
            id="forgotUsername"
            placeholder="Dein Benutzername">
        </div>

        <button
          class="main-btn"
          onclick="forgotPassword()">
          Passwort zurücksetzen
        </button>

        <button
          class="link-btn"
          onclick="showLogin()">
          Zurück zur Anmeldung
        </button>

      </div>

      <div id="authMessage"></div>

    </div>
  </section>


  <!-- =========================
       APP
  ========================= -->

  <main id="app" class="hidden">

    <aside id="sidebar" class="sidebar">

      <div class="brand">
        <div class="brand-title">FortX</div>
        <div id="brandUser" class="brand-user"></div>
      </div>

      <div class="nav">

        <div class="nav-title">
          Chats
        </div>

        <button
          id="generalChatButton"
          class="chat-item active"
          onclick="openGeneralChat()">

          <div class="avatar">#</div>

          <div class="chat-info">
            <div class="chat-name">
              Allgemein
            </div>
            <div class="chat-sub">
              Gruppenchat
            </div>
          </div>

        </button>

        <div class="nav-title">
          Freunde
        </div>

        <div id="friendsList"></div>

        <button
          class="side-btn"
          onclick="openAddFriend()">
          ＋ Freund hinzufügen
        </button>

      </div>

      <div class="sidebar-bottom">

        <button
          class="side-btn"
          onclick="openSettings()">
          ⚙ Einstellungen
        </button>

        <button
          class="side-btn"
          onclick="logout()">
          ↪ Abmelden
        </button>

      </div>

    </aside>


    <section class="chat">

      <header class="chat-header">

        <button
          class="mobile-menu"
          onclick="toggleSidebar()">
          ☰
        </button>

        <div>
          <div id="headerTitle" class="header-title">
            Allgemein
          </div>

          <div id="headerStatus" class="header-status">
            Gruppenchat
          </div>
        </div>

      </header>


      <div id="messages">

        <div class="empty" id="emptyMessage">
          Noch keine Nachrichten.
        </div>

      </div>


      <div id="composer" class="composer">

        <input
          id="messageInput"
          placeholder="Nachricht schreiben..."
          autocomplete="off"
          onkeydown="handleMessageKey(event)">

        <button
          class="send-btn"
          onclick="sendMessage()">
          ➤
        </button>

      </div>

    </section>

  </main>


  <!-- =========================
       ADD FRIEND MODAL
  ========================= -->

  <div
    id="friendModal"
    class="modal hidden">

    <div class="modal-box">

      <button
        class="modal-close"
        onclick="closeModal('friendModal')">
        ×
      </button>

      <div class="modal-title">
        Freund hinzufügen
      </div>

      <div class="field">
        <label>Benutzername</label>

        <input
          id="friendUsername"
          placeholder="Benutzername">
      </div>

      <button
        class="main-btn"
        onclick="addFriend()">
        Hinzufügen
      </button>

      <div id="friendMessage"
           class="authMessage">
      </div>

    </div>

  </div>


  <!-- =========================
       SETTINGS
  ========================= -->

  <div
    id="settingsModal"
    class="modal hidden">

    <div class="modal-box">

      <button
        class="modal-close"
        onclick="closeModal('settingsModal')">
        ×
      </button>

      <div class="modal-title">
        Einstellungen
      </div>

      <div class="setting-row">

        <div>
          <div class="setting-name">
            Dunkel / Hell
          </div>

          <div class="setting-desc">
            Erscheinungsbild von FortX
          </div>
        </div>

        <div
          id="themeSwitch"
          class="switch"
          onclick="toggleTheme()">
        </div>

      </div>

      <div class="setting-row">

        <div>
          <div class="setting-name">
            Konto
          </div>

          <div class="setting-desc"
               id="settingsUsername">
          </div>
        </div>

      </div>

    </div>

  </div>


  <!-- =========================
       ADMIN RESET MODAL
  ========================= -->

  <div
    id="resetRequestModal"
    class="modal hidden">

    <div class="modal-box">

      <button
        class="modal-close"
        onclick="closeModal('resetRequestModal')">
        ×
      </button>

      <div class="modal-title">
        🔐 Passwort-Anfrage
      </div>

      <p id="resetRequestText"
         style="color:#aaa;">
      </p>

      <button
        class="main-btn"
        onclick="createResetLink()">
        Reset-Link erstellen
      </button>

      <div id="resetLinkBox"
           class="hidden"
           style="margin-top:15px;">

        <input
          id="resetLink"
          readonly
          style="
            width:100%;
            background:#050505;
            color:white;
            border:1px solid #333;
            padding:12px;
            border-radius:10px;
          ">

        <button
          class="secondary-btn"
          onclick="copyResetLink()">
          Link kopieren
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       PASSWORD RESET
  ========================= -->

  <div
    id="passwordResetModal"
    class="modal hidden">

    <div class="modal-box">

      <div class="modal-title">
        Neues Passwort
      </div>

      <div class="field">
        <label>Neues Passwort</label>

        <input
          id="newPassword"
          type="password"
          placeholder="Mindestens 8 Zeichen">
      </div>

      <button
        class="main-btn"
        onclick="resetPassword()">
        Passwort ändern
      </button>

      <div id="resetMessage"
           style="
             color:#999;
             text-align:center;
             margin-top:12px;
           ">
      </div>

    </div>

  </div>


<script>
  /* =====================================================
     FORTX CLIENT
  ===================================================== */

  const ADMINS = [
    "saftpresse040",
    "thcliquide"
  ];

  let socket = null;
  let currentUser = null;
  let currentChat = "general";
  let resetToken = null;
  let pendingResetUser = null;

  let friends = [];

  const $ = id =>
    document.getElementById(id);


  /* =====================================================
     WEBSOCKET
  ===================================================== */

  function getSocketUrl() {

    const protocol =
      location.protocol === "https:"
        ? "wss:"
        : "ws:";

    return (
      protocol +
      "//" +
      location.host
    );
  }


  function connectSocket() {

    if (
      socket &&
      (
        socket.readyState ===
          WebSocket.OPEN ||
        socket.readyState ===
          WebSocket.CONNECTING
      )
    ) {
      return;
    }

    socket =
      new WebSocket(
        getSocketUrl()
      );

    socket.onopen = () => {

      console.log(
        "✅ WebSocket verbunden"
      );

      if (currentUser) {

        requestFriends();

        setTimeout(
          () => {
            if (currentChat === "general") {
              requestGroupMessages();
            }
          },
          100
        );
      }
    };

    socket.onclose = () => {

      console.log(
        "🔌 Verbindung getrennt"
      );

      setTimeout(
        connectSocket,
        2000
      );
    };

    socket.onerror = error => {

      console.error(
        "WebSocket-Fehler:",
        error
      );
    };

    socket.onmessage = event => {

      try {

        const data =
          JSON.parse(
            event.data
          );

        handleServerMessage(
          data
        );

      } catch (error) {

        console.error(
          "Ungültige Serverantwort:",
          error
        );
      }
    };
  }


  function wsSend(data) {

    if (
      !socket ||
      socket.readyState !==
        WebSocket.OPEN
    ) {

      showAuthMessage(
        "Keine Serververbindung."
      );

      return false;
    }

    socket.send(
      JSON.stringify(data)
    );

    return true;
  }


  /* =====================================================
     SERVER EVENTS
  ===================================================== */

  function handleServerMessage(data) {

    console.log(
      "Server:",
      data
    );

    if (
      data.type === "error"
    ) {

      showAuthMessage(
        data.text ||
        "Fehler"
      );

      if ($("friendMessage")) {
        $("friendMessage").textContent =
          data.text || "Fehler";
      }

      return;
    }


    if (
      data.type === "registered"
    ) {

      currentUser =
        data.username;

      showApp();

      return;
    }


    if (
      data.type === "loggedIn"
    ) {

      currentUser =
        data.username;

      showApp();

      return;
    }


    if (
      data.type ===
      "forgotPasswordSent"
    ) {

      showAuthMessage(
        data.text ||
        "Die Anfrage wurde gesendet."
      );

      return;
    }


    if (
      data.type ===
      "passwordResetSuccess"
    ) {

      $("resetMessage").textContent =
        "Passwort erfolgreich geändert.";

      setTimeout(
        () => {

          closeModal(
            "passwordResetModal"
          );

          location.href =
            location.pathname;

        },
        1200
      );

      return;
    }


    if (
      data.type ===
      "friends"
    ) {

      friends =
        Array.isArray(data.friends)
          ? data.friends
          : [];

      renderFriends();

      return;
    }


    if (
      data.type ===
      "friendAdded"
    ) {

      $("friendMessage").textContent =
        "Freund hinzugefügt.";

      requestFriends();

      setTimeout(
        () => {
          closeModal(
            "friendModal"
          );
        },
        700
      );

      return;
    }


    /* =========================
       GRUPPEN NACHRICHTEN
    ========================= */

    if (
      data.type ===
      "groupMessages"
    ) {

      if (
        currentChat !==
        "general"
      ) {
        return;
      }

      clearMessages();

      const messages =
        Array.isArray(
          data.messages
        )
          ? data.messages
          : [];

      messages.forEach(
        message => {

          appendGroupMessage(
            message,
            false
          );

        }
      );

      scrollMessages();

      return;
    }


    if (
      data.type ===
      "groupMessage"
    ) {

      if (
        currentChat !==
        "general"
      ) {
        return;
      }

      appendGroupMessage(
        data.message,
        true
      );

      scrollMessages();

      return;
    }


    /* =========================
       PRIVATE CHAT
    ========================= */

    if (
      data.type ===
      "privateMessages"
    ) {

      if (
        currentChat !==
        data.username
      ) {
        return;
      }

      clearMessages();

      const messages =
        Array.isArray(
          data.messages
        )
          ? data.messages
          : [];

      messages.forEach(
        message => {

          appendPrivateMessage(
            message
          );

        }
      );

      scrollMessages();

      return;
    }


    if (
      data.type === "message"
    ) {

      const otherUser =
        data.from === currentUser
          ? data.to
          : data.from;

      if (
        currentChat ===
        otherUser
      ) {

        appendPrivateMessage(
          data
        );

        scrollMessages();

      }

      return;
    }


    /* =========================
       ADMIN PASSWORD RESET
    ========================= */

    if (
      data.type ===
      "passwordResetRequest"
    ) {

      pendingResetUser =
        data.username;

      $("resetRequestText").textContent =
        "Benutzer „" +
        data.username +
        "“ möchte sein Passwort zurücksetzen.";

      $("resetLinkBox")
        .classList
        .add("hidden");

      openModal(
        "resetRequestModal"
      );

      return;
    }


    if (
      data.type ===
      "passwordResetLink"
    ) {

      $("resetLink").value =
        data.resetUrl;

      $("resetLinkBox")
        .classList
        .remove("hidden");

      return;
    }

  }


  /* =====================================================
     AUTH
  ===================================================== */

  function showLogin() {

    $("loginForm")
      .classList
      .remove("hidden");

    $("registerForm")
      .classList
      .add("hidden");

    $("forgotForm")
      .classList
      .add("hidden");

    $("loginTab")
      .classList
      .add("active");

    $("registerTab")
      .classList
      .remove("active");

    showAuthMessage("");
  }


  function showRegister() {

    $("loginForm")
      .classList
      .add("hidden");

    $("registerForm")
      .classList
      .remove("hidden");

    $("forgotForm")
      .classList
      .add("hidden");

    $("loginTab")
      .classList
      .remove("active");

    $("registerTab")
      .classList
      .add("active");

    showAuthMessage("");
  }


  function showForgot() {

    $("loginForm")
      .classList
      .add("hidden");

    $("registerForm")
      .classList
      .add("hidden");

    $("forgotForm")
      .classList
      .remove("hidden");

    $("loginTab")
      .classList
      .remove("active");

    $("registerTab")
      .classList
      .remove("active");

    showAuthMessage("");
  }


  function login() {

    const username =
      $("loginUsername")
        .value
        .trim();

    const password =
      $("loginPassword")
        .value;

    if (!username || !password) {

      showAuthMessage(
        "Bitte alles ausfüllen."
      );

      return;
    }

    wsSend({
      type: "login",
      username,
      password
    });
  }


  function register() {

    const username =
      $("registerUsername")
        .value
        .trim();

    const password =
      $("registerPassword")
        .value;

    const accessCode =
      $("registerAccessCode")
        .value;

    if (!username ||
        !password ||
        !accessCode) {

      showAuthMessage(
        "Bitte alles ausfüllen."
      );

      return;
    }

    wsSend({
      type: "register",
      username,
      password,
      accessCode
    });
  }


  function forgotPassword() {

    const username =
      $("forgotUsername")
        .value
        .trim();

    if (!username) {

      showAuthMessage(
        "Bitte Benutzername eingeben."
      );

      return;
    }

    wsSend({
      type:
        "forgotPassword",
      username
    });
  }


  function showAuthMessage(text) {

    $("authMessage").textContent =
      text || "";
  }


  /* =====================================================
     APP
  ===================================================== */

  function showApp() {

    $("authScreen")
      .classList
      .add("hidden");

    $("app")
      .classList
      .remove("hidden");

    $("brandUser").textContent =
      "@" + currentUser;

    $("settingsUsername").textContent =
      "@" + currentUser;

    connectSocket();

    requestFriends();

    openGeneralChat();

    handleResetUrl();
  }


  function logout() {

    currentUser = null;

    if (socket) {

      try {
        socket.close();
      } catch {}
    }

    location.reload();
  }


  /* =====================================================
     FRIENDS
  ===================================================== */

  function requestFriends() {

    wsSend({
      type: "getFriends"
    });
  }


  function renderFriends() {

    const list =
      $("friendsList");

    list.innerHTML = "";

    if (!friends.length) {

      const empty =
        document.createElement(
          "div"
        );

      empty.style.color =
        "#555";

      empty.style.fontSize =
        "12px";

      empty.style.padding =
        "8px 10px";

      empty.textContent =
        "Noch keine Freunde.";

      list.appendChild(
        empty
      );

      return;
    }

    friends.forEach(
      username => {

        const button =
          document.createElement(
            "button"
          );

        button.className =
          "chat-item";

        button.onclick = () =>
          openPrivateChat(
            username
          );

        const avatar =
          document.createElement(
            "div"
          );

        avatar.className =
          "avatar";

        avatar.textContent =
          username
            .charAt(0)
            .toUpperCase();

        const info =
          document.createElement(
            "div"
          );

        info.className =
          "chat-info";

        const name =
          document.createElement(
            "div"
          );

        name.className =
          "chat-name";

        if (
          ADMINS.includes(
            username
          )
        ) {

          name.innerHTML =
            "👑 " +
            adminNameHTML(
              username
            );

        } else {

          name.textContent =
            username;

        }

        const sub =
          document.createElement(
            "div"
          );

        sub.className =
          "chat-sub";

        sub.textContent =
          "Privater Chat";

        info.appendChild(name);
        info.appendChild(sub);

        button.appendChild(
          avatar
        );

        button.appendChild(
          info
        );

        list.appendChild(
          button
        );

      }
    );
  }


  function openAddFriend() {

    $("friendUsername").value =
      "";

    $("friendMessage").textContent =
      "";

    openModal(
      "friendModal"
    );
  }


  function addFriend() {

    const username =
      $("friendUsername")
        .value
        .trim();

    if (!username) {

      $("friendMessage").textContent =
        "Bitte Benutzername eingeben.";

      return;
    }

    wsSend({
      type: "addFriend",
      username
    });
  }


  /* =====================================================
     GENERAL CHAT
  ===================================================== */

  function openGeneralChat() {

    currentChat =
      "general";

    $("headerTitle").textContent =
      "Allgemein";

    $("headerStatus").textContent =
      ADMINS.includes(currentUser)
        ? "Gruppenchat · Admin"
        : "Gruppenchat · Nur lesen";

    $("generalChatButton")
      .classList
      .add("active");

    document
      .querySelectorAll(
        ".chat-item"
      )
      .forEach(
        item => {

          if (
            item !==
            $("generalChatButton")
          ) {
            item.classList.remove(
              "active"
            );
          }

        }
      );

    if (
      ADMINS.includes(
        currentUser
      )
    ) {

      $("composer")
        .classList
        .remove("readonly");

      $("messageInput")
        .disabled = false;

      $("messageInput")
        .placeholder =
        "Nachricht an Allgemein...";

    } else {

      $("composer")
        .classList
        .add("readonly");

      $("messageInput")
        .disabled = true;

      $("messageInput")
        .placeholder =
        "Nur Admins können hier schreiben";

    }

    clearMessages();

    requestGroupMessages();

    closeSidebarMobile();
  }


  function requestGroupMessages() {

    wsSend({
      type:
        "getGroupMessages"
    });
  }


  function appendGroupMessage(
    message,
    isNew
  ) {

    if (!message) return;

    const username =
      String(
        message.username ||
        ""
      );

    const text =
      String(
        message.text ||
        ""
      );

    if (!username || !text)
      return;

    removeEmpty();

    const wrapper =
      document.createElement(
        "div"
      );

    wrapper.className =
      "message";

    if (
      username ===
      currentUser
    ) {
      wrapper.classList.add(
        "mine"
      );
    }

    const user =
      document.createElement(
        "div"
      );

    user.className =
      "message-user";

    if (
      ADMINS.includes(
        username
      )
    ) {

      user.innerHTML =
        "👑 " +
        adminNameHTML(
          username
        );

    } else {

      user.textContent =
        username;

    }

    const bubble =
      document.createElement(
        "div"
      );

    bubble.className =
      "bubble";

    bubble.textContent =
      text;

    const time =
      document.createElement(
        "div"
      );

    time.className =
      "message-time";

    time.textContent =
      formatTime(
        message.time
      );

    wrapper.appendChild(
      user
    );

    wrapper.appendChild(
      bubble
    );

    wrapper.appendChild(
      time
    );

    $("messages")
      .appendChild(
        wrapper
      );

  }


  /* =====================================================
     PRIVATE CHAT
  ===================================================== */

  function openPrivateChat(
    username
  ) {

    currentChat =
      username;

    $("headerTitle").innerHTML =
      ADMINS.includes(username)
        ? "👑 " +
          adminNameHTML(username)
        : escapeHTML(username);

    $("headerStatus").textContent =
      "Privater Chat";

    $("generalChatButton")
      .classList
      .remove("active");

    document
      .querySelectorAll(
        ".chat-item"
      )
      .forEach(
        item => {

          if (
            item !==
            $("generalChatButton")
          ) {
            item.classList.remove(
              "active"
            );
          }

        }
      );

    $("composer")
      .classList
      .remove("readonly");

    $("messageInput")
      .disabled = false;

    $("messageInput")
      .placeholder =
      "Nachricht schreiben...";

    clearMessages();

    wsSend({
      type:
        "getPrivateMessages",

      username
    });

    closeSidebarMobile();
  }


  function appendPrivateMessage(
    message
  ) {

    if (!message) return;

    const from =
      message.from ||
      message.sender ||
      "";

    const text =
      message.text ||
      "";

    if (!from || !text)
      return;

    removeEmpty();

    const wrapper =
      document.createElement(
        "div"
      );

    wrapper.className =
      "message";

    if (
      from ===
      currentUser
    ) {

      wrapper.classList.add(
        "mine"
      );
    }

    const user =
      document.createElement(
        "div"
      );

    user.className =
      "message-user";

    if (
      ADMINS.includes(from)
    ) {

      user.innerHTML =
        "👑 " +
        adminNameHTML(from);

    } else {

      user.textContent =
        from;

    }

    const bubble =
      document.createElement(
        "div"
      );

    bubble.className =
      "bubble";

    bubble.textContent =
      text;

    const time =
      document.createElement(
        "div"
      );

    time.className =
      "message-time";

    time.textContent =
      formatTime(
        message.time
      );

    wrapper.appendChild(
      user
    );

    wrapper.appendChild(
      bubble
    );

    wrapper.appendChild(
      time
    );

    $("messages")
      .appendChild(
        wrapper
      );
  }


  function sendMessage() {

    const input =
      $("messageInput");

    const text =
      input.value.trim();

    if (!text)
      return;

    if (
      currentChat ===
      "general"
    ) {

      if (
        !ADMINS.includes(
          currentUser
        )
      ) {
        return;
      }

      wsSend({
        type:
          "groupMessage",

        text
      });

    } else {

      wsSend({
        type:
          "message",

        to:
          currentChat,

        text
      });
    }

    input.value = "";
    input.focus();
  }


  function handleMessageKey(
    event
  ) {

    if (
      event.key ===
      "Enter"
    ) {

      event.preventDefault();

      sendMessage();
    }
  }


  /* =====================================================
     UI HELPERS
  ===================================================== */

  function clearMessages() {

    $("messages").innerHTML =
      `
        <div
          class="empty"
          id="emptyMessage">
          Noch keine Nachrichten.
        </div>
      `;
  }


  function removeEmpty() {

    const empty =
      $("emptyMessage");

    if (empty) {
      empty.remove();
    }
  }


  function scrollMessages() {

    const messages =
      $("messages");

    setTimeout(
      () => {

        messages.scrollTop =
          messages.scrollHeight;

      },
      20
    );
  }


  function formatTime(
    timestamp
  ) {

    if (!timestamp)
      return "";

    const date =
      new Date(
        Number(timestamp)
      );

    if (
      Number.isNaN(
        date.getTime()
      )
    ) {
      return "";
    }

    return date.toLocaleTimeString(
      "de-DE",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );
  }


  function adminNameHTML(
    username
  ) {

    return (
      '<span class="admin-name">' +
      escapeHTML(username) +
      '</span>'
    );
  }


  function escapeHTML(
    value
  ) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  /* =====================================================
     MODALS
  ===================================================== */

  function openModal(id) {

    $(id)
      .classList
      .remove("hidden");
  }


  function closeModal(id) {

    $(id)
      .classList
      .add("hidden");
  }


  /* =====================================================
     SETTINGS / THEME
  ===================================================== */

  function openSettings() {

    updateThemeSwitch();

    openModal(
      "settingsModal"
    );

    closeSidebarMobile();
  }


  function toggleTheme() {

    document.body
      .classList
      .toggle("light");

    localStorage.setItem(
      "fortxTheme",
      document.body
        .classList
        .contains("light")
        ? "light"
        : "dark"
    );

    updateThemeSwitch();
  }


  function updateThemeSwitch() {

    const light =
      document.body
        .classList
        .contains("light");

    if (light) {

      $("themeSwitch")
        .classList
        .add("light");

    } else {

      $("themeSwitch")
        .classList
        .remove("light");

    }
  }


  function loadTheme() {

    const theme =
      localStorage.getItem(
        "fortxTheme"
      );

    if (theme === "light") {

      document.body
        .classList
        .add("light");

    } else {

      document.body
        .classList
        .remove("light");

    }
  }


  /* =====================================================
     MOBILE SIDEBAR
  ===================================================== */

  function toggleSidebar() {

    $("sidebar")
      .classList
      .toggle("open");
  }


  function closeSidebarMobile() {

    $("sidebar")
      .classList
      .remove("open");
  }


  /* =====================================================
     PASSWORD RESET
  ===================================================== */

  function handleResetUrl() {

    const params =
      new URLSearchParams(
        location.search
      );

    const token =
      params.get(
        "reset"
      );

    if (!token)
      return;

    resetToken =
      token;

    openModal(
      "passwordResetModal"
    );
  }


  function resetPassword() {

    const password =
      $("newPassword")
        .value;

    if (
      password.length < 8
    ) {

      $("resetMessage")
        .textContent =
        "Mindestens 8 Zeichen.";

      return;
    }

    wsSend({
      type:
        "resetPassword",

      token:
        resetToken,

      password
    });
  }


  function createResetLink() {

    if (
      !pendingResetUser
    ) {
      return;
    }

    wsSend({
      type:
        "createPasswordReset",

      username:
        pendingResetUser
    });
  }


  async function copyResetLink() {

    const link =
      $("resetLink").value;

    try {

      await navigator.clipboard
        .writeText(link);

      alert(
        "Reset-Link kopiert."
      );

    } catch {

      $("resetLink")
        .select();

      document.execCommand(
        "copy"
      );
    }
  }


  /* =====================================================
     START
  ===================================================== */

  loadTheme();

  connectSocket();

  window.addEventListener(
    "load",
    () => {

      handleResetUrl();

    }
  );

</script>

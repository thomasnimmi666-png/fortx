<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">

  <title>Privater Messenger</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
    }

    .screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 380px;
      background: #111;
      border: 1px solid #292929;
      border-radius: 20px;
      padding: 25px;
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    p {
      color: #999;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      background: #181818;
      color: white;
      border: 1px solid #333;
      border-radius: 12px;
      outline: none;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 12px;
      background: white;
      color: black;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .secondary {
      background: #222;
      color: white;
      border: 1px solid #333;
    }

    .error {
      color: #ff5c5c;
      text-align: center;
      min-height: 20px;
      margin-top: 10px;
    }

    #loginScreen,
    #registerScreen,
    #app {
      display: none;
    }

    header {
      padding: 18px;
      text-align: center;
      font-size: 21px;
      font-weight: bold;
      border-bottom: 1px solid #222;
    }

    #status {
      text-align: center;
      padding: 8px;
      color: #999;
      font-size: 13px;
    }

    .page {
      padding: 16px;
    }

    .profile {
      text-align: center;
      padding: 20px 10px;
      border-bottom: 1px solid #222;
    }

    #profileImage {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      background: #222;
      display: block;
      margin: auto auto 12px;
    }

    .profileButton {
      width: auto;
      padding: 10px 16px;
      margin-top: 5px;
    }

    #search {
      margin: 18px 0;
    }

    .friend {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px;
      margin-bottom: 8px;
      background: #111;
      border: 1px solid #222;
      border-radius: 15px;
      cursor: pointer;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
    }

    .friendName {
      font-weight: bold;
    }

    .lastMessage {
      color: #888;
      font-size: 14px;
      margin-top: 4px;
    }

    #chatPage {
      display: none;
      height: calc(100vh - 90px);
      flex-direction: column;
    }

    #chatHeader {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-bottom: 1px solid #222;
    }

    #backButton {
      width: auto;
      margin: 0;
      padding: 5px 10px;
      background: none;
      color: white;
      font-size: 25px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      width: fit-content;
      max-width: 80%;
      padding: 10px 14px;
      margin: 8px 0;
      background: #181818;
      border: 1px solid #292929;
      border-radius: 15px;
    }

    .mine {
      margin-left: auto;
      background: #252525;
    }

    #inputArea {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid #222;
    }

    #messageInput {
      margin: 0;
      flex: 1;
    }

    #sendButton {
      width: auto;
      margin: 0;
    }
  </style>
</head>

<body>

<!-- ZUGANGSCODE -->

<div id="accessScreen" class="screen">

  <div class="box">

    <h1>🔐</h1>

    <h2 style="text-align:center;">
      Privater Messenger
    </h2>

    <p>
      Gib den Zugangscode ein.
    </p>

    <input
      id="accessCode"
      type="password"
      placeholder="Zugangscode"
    >

    <button onclick="checkAccess()">
      Weiter
    </button>

    <div id="accessError" class="error"></div>

  </div>

</div>


<!-- LOGIN -->

<div id="loginScreen" class="screen">

  <div class="box">

    <h1>👤</h1>

    <h2 style="text-align:center;">
      Anmelden
    </h2>

    <input
      id="loginUsername"
      type="text"
      placeholder="Benutzername"
      autocomplete="username"
    >

    <input
      id="loginPassword"
      type="password"
      placeholder="Passwort"
      autocomplete="current-password"
    >

    <button onclick="login()">
      Anmelden
    </button>

    <button
      class="secondary"
      onclick="showRegister()"
    >
      Neues Konto erstellen
    </button>

    <div id="loginError" class="error"></div>

  </div>

</div>


<!-- REGISTRIERUNG -->

<div id="registerScreen" class="screen">

  <div class="box">

    <h1>✨</h1>

    <h2 style="text-align:center;">
      Konto erstellen
    </h2>

    <input
      id="registerUsername"
      type="text"
      placeholder="Benutzername"
      autocomplete="username"
    >

    <input
      id="registerPassword"
      type="password"
      placeholder="Passwort (mind. 8 Zeichen)"
      autocomplete="new-password"
    >

    <button onclick="register()">
      Konto erstellen
    </button>

    <button
      class="secondary"
      onclick="showLogin()"
    >
      Zur Anmeldung
    </button>

    <div id="registerError" class="error"></div>

  </div>

</div>


<!-- APP -->

<div id="app">

  <header>
    🔐 Privater Messenger
  </header>

  <div id="status">
    🔄 Verbindung wird hergestellt...
  </div>

  <div id="homePage" class="page">

    <div class="profile">

      <img
        id="profileImage"
        alt="Profilbild"
      >

      <div id="myUsername">
        Benutzer
      </div>

      <input
        id="profileFile"
        type="file"
        accept="image/*"
        style="display:none"
        onchange="changeProfileImage(event)"
      >

      <button
        class="profileButton"
        onclick="document.getElementById('profileFile').click()"
      >
        🖼️ Profilbild ändern
      </button>

    </div>

    <input
      id="friendUsername"
      type="text"
      placeholder="Benutzername für Freund hinzufügen"
    >

    <button onclick="addFriend()">
      + Freund hinzufügen
    </button>

    <input
      id="search"
      type="text"
      placeholder="🔎 Freunde suchen..."
      oninput="searchFriends()"
    >

    <div id="friends">

      <div
        class="friend"
        onclick="openChat('Max')"
      >
        <div class="avatar">👤</div>

        <div>
          <div class="friendName">Max</div>
          <div class="lastMessage">Testfreund</div>
        </div>
      </div>

    </div>

  </div>


  <!-- CHAT -->

  <div id="chatPage">

    <div id="chatHeader">

      <button
        id="backButton"
        onclick="closeChat()"
      >
        ←
      </button>

      <strong id="chatTitle">
        Chat
      </strong>

    </div>

    <div id="messages"></div>

    <div id="inputArea">

      <input
        id="messageInput"
        type="text"
        placeholder="Nachricht schreiben..."
      >

      <button
        id="sendButton"
        onclick="sendMessage()"
      >
        Senden
      </button>

    </div>

  </div>

</div>


<script>

  let socket;
  let currentFriend = null;


  function connectSocket() {

    socket = new WebSocket(
      "wss://fortx.onrender.com"
    );

    socket.onopen = () => {

      document.getElementById(
        "status"
      ).textContent =
        "🟢 Server verbunden";

    };


    socket.onmessage = (event) => {

      try {

        const data =
          JSON.parse(event.data);


        if (
          data.type === "error"
        ) {

          alert(data.text);
          return;

        }


        if (
          data.type === "registered"
        ) {

          localStorage.setItem(
            "username",
            data.username
          );

          showApp();
          return;

        }


        if (
          data.type === "loggedIn"
        ) {

          localStorage.setItem(
            "username",
            data.username
          );

          showApp();
          return;

        }


        if (
          data.type === "friendRequest"
        ) {

          alert(
            "Neue Freundschaftsanfrage von @" +
            data.from
          );

          return;

        }


        if (
          data.type === "requestSent"
        ) {

          alert(
            "Anfrage an @" +
            data.to +
            " gesendet."
          );

          return;

        }


        if (
          data.type === "message"
        ) {

          if (
            data.from === currentFriend
          ) {

            addMessage(
              data.text,
              false
            );

          }

        }

      } catch (error) {

        console.log(error);

      }

    };


    socket.onerror = () => {

      document.getElementById(
        "status"
      ).textContent =
        "🔴 Server nicht erreichbar";

    };


    socket.onclose = () => {

      document.getElementById(
        "status"
      ).textContent =
        "🔴 Verbindung getrennt";

    };

  }


  function checkAccess() {

    const code =
      document.getElementById(
        "accessCode"
      ).value;

    /*
      Der Zugangscode wird absichtlich
      NICHT im HTML gespeichert.

      Die echte Prüfung passiert später
      über den Server.
    */

    if (!code) {

      document.getElementById(
        "accessError"
      ).textContent =
        "Bitte Zugangscode eingeben.";

      return;

    }

    sessionStorage.setItem(
      "accessCode",
      code
    );

    document.getElementById(
      "accessScreen"
    ).style.display =
      "none";

    document.getElementById(
      "loginScreen"
    ).style.display =
      "flex";

  }


  function showRegister() {

    document.getElementById(
      "loginScreen"
    ).style.display =
      "none";

    document.getElementById(
      "registerScreen"
    ).style.display =
      "flex";

  }


  function showLogin() {

    document.getElementById(
      "registerScreen"
    ).style.display =
      "none";

    document.getElementById(
      "loginScreen"
    ).style.display =
      "flex";

  }


  function register() {

    const username =
      document.getElementById(
        "registerUsername"
      ).value.trim();

    const password =
      document.getElementById(
        "registerPassword"
      ).value;

    const accessCode =
      sessionStorage.getItem(
        "accessCode"
      );


    if (!username || !password) {

      document.getElementById(
        "registerError"
      ).textContent =
        "Bitte alles ausfüllen.";

      return;

    }


    if (
      socket.readyState !==
      WebSocket.OPEN
    ) {

      document.getElementById(
        "registerError"
      ).textContent =
        "Server noch nicht verbunden.";

      return;

    }


    socket.send(
      JSON.stringify({

        type:
          "register",

        username:
          username,

        password:
          password,

        accessCode:
          accessCode

      })
    );

  }


  function login() {

    const username =
      document.getElementById(
        "loginUsername"
      ).value.trim();

    const password =
      document.getElementById(
        "loginPassword"
      ).value;


    if (!username || !password) {

      document.getElementById(
        "loginError"
      ).textContent =
        "Bitte Benutzername und Passwort eingeben.";

      return;

    }


    if (
      socket.readyState !==
      WebSocket.OPEN
    ) {

      document.getElementById(
        "loginError"
      ).textContent =
        "Server noch nicht verbunden.";

      return;

    }


    socket.send(
      JSON.stringify({

        type:
          "login",

        username:
          username,

        password:
          password

      })
    );

  }


  function showApp() {

    document.getElementById(
      "loginScreen"
    ).style.display =
      "none";

    document.getElementById(
      "registerScreen"
    ).style.display =
      "none";

    document.getElementById(
      "app"
    ).style.display =
      "block";

    document.getElementById(
      "myUsername"
    ).textContent =
      "@" +
      localStorage.getItem(
        "username"
      );

  }


  function addFriend() {

    const input =
      document.getElementById(
        "friendUsername"
      );

    const username =
      input.value.trim();

    if (!username) {

      alert(
        "Bitte einen Benutzernamen eingeben."
      );

      return;

    }


    if (
      socket.readyState !==
      WebSocket.OPEN
    ) {

      alert(
        "Keine Serververbindung."
      );

      return;

    }


    socket.send(
      JSON.stringify({

        type:
          "addFriend",

        username:
          username

      })
    );


    input.value = "";

  }


  function openChat(friend) {

    currentFriend =
      friend;

    document.getElementById(
      "homePage"
    ).style.display =
      "none";

    document.getElementById(
      "chatPage"
    ).style.display =
      "flex";

    document.getElementById(
      "chatTitle"
    ).textContent =
      "@" + friend;

    document.getElementById(
      "messages"
    ).innerHTML =
      "";

  }


  function closeChat() {

    currentFriend =
      null;

    document.getElementById(
      "chatPage"
    ).style.display =
      "none";

    document.getElementById(
      "homePage"
    ).style.display =
      "block";

  }


  function sendMessage() {

    const input =
      document.getElementById(
        "messageInput"
      );

    const text =
      input.value.trim();


    if (!text) {
      return;
    }


    if (
      socket.readyState !==
      WebSocket.OPEN
    ) {

      alert(
        "Keine Serververbindung."
      );

      return;

    }


    socket.send(
      JSON.stringify({

        type:
          "message",

        to:
          currentFriend,

        text:
          text

      })
    );


    addMessage(
      text,
      true
    );

    input.value = "";

  }


  function addMessage(
    text,
    mine
  ) {

    const message =
      document.createElement(
        "div"
      );

    message.className =
      mine
        ? "message mine"
        : "message";

    message.textContent =
      text;

    document.getElementById(
      "messages"
    ).appendChild(
      message
    );

    const messages =
      document.getElementById(
        "messages"
      );

    messages.scrollTop =
      messages.scrollHeight;

  }


  function searchFriends() {

    const search =
      document.getElementById(
        "search"
      )
      .value
      .toLowerCase();

    document
      .querySelectorAll(
        ".friend"
      )
      .forEach(
        friend => {

          const name =
            friend
              .querySelector(
                ".friendName"
              )
              .textContent
              .toLowerCase();

          friend.style.display =
            name.includes(search)
              ? "flex"
              : "none";

        }
      );

  }


  function changeProfileImage(event) {

    const file =
      event.target.files[0];

    if (!file) {
      return;
    }

    const reader =
      new FileReader();

    reader.onload =
      function(e) {

        document.getElementById(
          "profileImage"
        ).src =
          e.target.result;

        localStorage.setItem(
          "profileImage",
          e.target.result
        );

      };

    reader.readAsDataURL(
      file
    );

  }


  document
    .getElementById(
      "messageInput"
    )
    .addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Enter"
        ) {

          sendMessage();

        }

      }
    );


  const savedImage =
    localStorage.getItem(
      "profileImage"
    );

  if (savedImage) {

    document.getElementById(
      "profileImage"
    ).src =
      savedImage;

  }


  connectSocket();

</script>

</body>
</html>

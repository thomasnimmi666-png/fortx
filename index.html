<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="manifest.json">

  <title>Privater Messenger</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
    }

    header {
      padding: 18px;
      background: #111827;
      color: white;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    #status {
      padding: 10px;
      text-align: center;
      background: #e5e7eb;
      font-size: 14px;
    }

    #messages {
      height: calc(100vh - 150px);
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      margin: 8px 0;
      border-radius: 14px;
      background: white;
      word-wrap: break-word;
    }

    .mine {
      margin-left: auto;
      background: #dbeafe;
    }

    #inputArea {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      gap: 8px;
      padding: 10px;
      background: white;
      border-top: 1px solid #ddd;
    }

    #messageInput {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 20px;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 20px;
      background: #111827;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <header>
    🔐 Privater Messenger
  </header>

  <div id="status">
    🔄 Verbindung wird hergestellt...
  </div>

  <div id="messages"></div>

  <div id="inputArea">
    <input
      id="messageInput"
      type="text"
      placeholder="Nachricht schreiben..."
      autocomplete="off"
    >

    <button onclick="sendMessage()">
      Senden
    </button>
  </div>

  <script>
    const messages = document.getElementById("messages");
    const status = document.getElementById("status");

    const socket = new WebSocket("wss://fortx.onrender.com");

    socket.onopen = () => {
      status.textContent = "🟢 Server verbunden";
    };

    socket.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);

        if (data.type === "system") {
          status.textContent = data.text;
          return;
        }

        addMessage(data.text);
      } catch (error) {
        console.error("Nachricht konnte nicht gelesen werden:", error);
      }
    };

    socket.onerror = () => {
      status.textContent = "🔴 Server nicht erreichbar";
    };

    socket.onclose = () => {
      status.textContent = "🔴 Verbindung getrennt";
    };

    function addMessage(text) {
      const message = document.createElement("div");
      message.className = "message";
      message.textContent = text;

      messages.appendChild(message);
      messages.scrollTop = messages.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById("messageInput");
      const text = input.value.trim();

      if (!text) {
        return;
      }

      if (socket.readyState !== WebSocket.OPEN) {
        status.textContent = "🔴 Keine Serververbindung";
        return;
      }

      socket.send(JSON.stringify({
        type: "message",
        text: text
      }));

      input.value = "";
    }

    document
      .getElementById("messageInput")
      .addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          sendMessage();
        }
      });
  </script>

</body>
</html>
